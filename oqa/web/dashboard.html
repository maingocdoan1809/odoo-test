<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Odoo Test: tiến độ</title>
<style>
  /* Neutral test-tool look: cool grey canvas, white work surfaces, ONE blue accent for actions, red/green/amber only for results. No external fonts: the stacks fall back to what the computer has. */
  /*__FONT_FACES__*/
  :root {
    --bg:#f5f6f8; --surface:#ffffff; --sunk:#eff1f4; --card:#f8f9fb; --line:#d9dde4; --line-soft:#e7eaef;
    --ink:#14171f; --body:#2d323d; --muted:#586072; --accent:#2563eb; --accent-active:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#eaf1ff; --ring:rgba(37,99,235,.25);
    --dark:#14171f; --dark-soft:#1b1f28; --dark-elev:#252a35; --on-dark:#eceef2; --on-dark-soft:#9aa3b2;
    --pass:#1a7f37; --fail:#c62828; --pending:#8f5a00; --blocked:#566070; --running:#0b6e8a; --repairing:#b45309; --planned:#667085;
    --display:"Be Vietnam Pro", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    --sans:"Be Vietnam Pro", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono:"JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", "DejaVu Sans Mono", monospace;
    --scrollbar-track:var(--sunk); --scrollbar-thumb:color-mix(in srgb, var(--muted) 60%, var(--sunk));
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f1218; --surface:#161a21; --sunk:#11141a; --card:#1b2029; --line:#2b313c; --line-soft:#222833;
    --ink:#eceef2; --body:#c9ced8; --muted:#9aa3b2; --accent:#3b82f6; --accent-active:#2563eb; --accent-ink:#ffffff; --accent-soft:#17233b; --ring:rgba(59,130,246,.35);
    --dark:#0b0d11; --dark-soft:#0b0d11; --dark-elev:#1b2029; --on-dark:#eceef2; --on-dark-soft:#9aa3b2;
    --pass:#4cc472; --fail:#f27878; --pending:#e0b341; --blocked:#9aa3b2; --running:#4fb8d6; --repairing:#f0a05a; --planned:#8b93a3; } }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--scrollbar-thumb) var(--scrollbar-track); }
  html { min-height:100%; }
  body { margin:0; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--body); font:14px/1.5 var(--sans); font-variant-numeric:tabular-nums; }
  button, input, select, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .muted { color:var(--muted); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  h1, h2, h3, h4 { color:var(--ink); margin:0; }
  [hidden] { display:none !important; }
  @keyframes pulse { 50% { opacity:.35; } }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---------- status vocabulary: icon + colour + word, never colour alone ---------- */
  .s-PASS, .s-VERIFIED { --c:var(--pass); } .s-FAIL { --c:var(--fail); } .s-PENDING { --c:var(--pending); }
  .s-BLOCKED, .s-STOPPED, .s-INTERRUPTED { --c:var(--blocked); } .s-RUNNING { --c:var(--running); }
  .s-REPAIRING, .s-EXPLORING, .s-TRYING { --c:var(--repairing); } .s-BUILT { --c:var(--pending); }
  .s-PLANNED, .s-HELD, .s-NEW, .s-NOT { --c:var(--planned); }
  .ico { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  .si { display:inline-flex; width:16px; height:16px; align-items:center; justify-content:center; color:var(--c); flex:none; }
  .spin { display:inline-block; flex:none; width:12px; height:12px; margin:0 2px; border:2px solid var(--line); border-top-color:var(--c); border-radius:50%; animation:spin .9s linear infinite; }
  .status { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; font-weight:600; font-size:12px; color:var(--c); }
  .sq { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; }
  @media (prefers-reduced-motion: reduce) { .spin, .dot.on, .lbspin { animation:pulse 1.8s ease-in-out infinite; } }

  /* ---------- controls ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font-weight:500; font-size:13px; cursor:pointer; white-space:nowrap; text-decoration:none; transition:background .14s ease, border-color .14s ease; }
  .btn:hover:not(:disabled) { background:var(--sunk); border-color:var(--muted); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover:not(:disabled) { background:var(--accent-active); border-color:var(--accent-active); }
  .btn.danger { color:var(--fail); border-color:var(--fail); }
  .btn.danger:hover:not(:disabled) { background:var(--fail); color:var(--surface); border-color:var(--fail); }
  .btn.sm { height:28px; padding:0 10px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:default; }
  a.btn.primary { color:var(--accent-ink); }
  .tag { display:inline-flex; align-items:center; font:500 11px/1.5 var(--sans); padding:0 7px; background:var(--sunk); border:1px solid var(--line-soft); border-radius:4px; color:var(--body); white-space:nowrap; }
  .tag.attn { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  select, input[type=search], input[type=number], textarea { border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); }
  select, input[type=search] { height:32px; padding:0 10px; }
  select:focus, textarea:focus, input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
  textarea { width:100%; min-height:64px; padding:8px 10px; resize:vertical; }
  .err { color:var(--fail); margin-top:6px; white-space:pre-wrap; font-size:13px; }
  .err:empty { display:none; }

  /* ---------- top bar ---------- */
  .top { position:sticky; top:0; z-index:10; flex:none; min-height:48px; display:flex; align-items:center; gap:20px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--line); }
  .top b { font:700 15px/1 var(--sans); color:var(--ink); letter-spacing:.01em; }
  .tabs { display:flex; max-width:100%; overflow-x:auto; }
  .tabs button { flex:none; background:none; border:0; border-bottom:2px solid transparent; padding:0 14px; height:47px; cursor:pointer; color:var(--muted); font-weight:500; }
  .tabs button:hover { color:var(--ink); }
  .tabs button[aria-selected=true] { color:var(--ink); border-bottom-color:var(--accent); }
  .live { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--planned); }
  .dot.on { background:var(--pass); animation:pulse 1.8s ease-in-out infinite; }

  /* ---------- page frame ---------- */
  .layout { flex:1; min-height:0; display:flex; flex-direction:column; }
  main { min-width:0; min-height:0; flex:1; display:flex; flex-direction:column; background:var(--bg); overflow-wrap:anywhere; container:dashboard / inline-size; }
  #scriptsMain, #siteMapMain { display:block; overflow:auto; padding:20px 24px 32px; }
  .empty { max-width:460px; margin:12vh auto; padding:0 16px; text-align:center; color:var(--muted); }
  .empty b { display:block; font:600 20px/1.3 var(--display); color:var(--ink); margin-bottom:8px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .bar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--line); gap:1px; }
  .bar i { display:block; min-width:3px; background:var(--c); }

  /* ---------- screen 1: the session list ---------- */
  .page { flex:1; min-height:0; overflow:auto; }
  .page-in { max-width:1080px; margin:0 auto; padding:24px 24px 40px; }
  .page-head h1 { font:600 22px/1.3 var(--display); }
  .page-head p { margin:4px 0 0; }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:18px 0 6px; }
  .toolbar input[type=search] { flex:1 1 200px; max-width:320px; }
  .toolbar select { width:auto; min-width:160px; }
  .seg { display:inline-flex; margin-left:auto; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface); }
  .seg button { height:30px; padding:0 12px; border:0; border-right:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; font-size:13px; }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed=true] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .group { margin:22px 0 8px; display:flex; align-items:center; gap:8px; font:600 12px/1.4 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .group .count { background:var(--sunk); border:1px solid var(--line-soft); border-radius:10px; padding:0 7px; font-size:11px; letter-spacing:0; }
  .group.need { color:var(--accent); } .group.need .count { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .srow-wrap { position:relative; margin-bottom:8px; }
  .srow { width:100%; text-align:left; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) minmax(190px,1fr); align-items:center; gap:6px 20px; padding:12px 44px 12px 16px; border:1px solid var(--line); border-radius:8px; background:var(--surface); cursor:pointer; transition:border-color .14s ease, background .14s ease; }
  .srow:hover { border-color:var(--accent); background:var(--card); }
  .srow[aria-current=true] { border-color:var(--accent); }
  .srow.need { border-left:3px solid var(--accent); }
  .s-name { font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .s-sub { color:var(--muted); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .s-state { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }
  .s-prog .bar { margin-bottom:5px; }
  .s-nums { display:flex; flex-wrap:wrap; gap:0 12px; font-size:12px; color:var(--muted); }
  .s-nums b { color:var(--ink); font-weight:600; }
  .s-nums .f b { color:var(--fail); } .s-nums .p b { color:var(--pass); }
  .srow-wrap .del { position:absolute; top:50%; right:10px; transform:translateY(-50%); width:28px; height:28px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; line-height:1; opacity:.55; }
  .srow-wrap .del:hover { opacity:1; color:var(--fail); background:var(--sunk); }

  /* ---------- screen 2: session bar ---------- */
  /* The session header: the answer to "how is this run going" at a glance, on the same surface as the rest of the page. */
  .sbar { flex:none; background:var(--surface); border-bottom:1px solid var(--line); padding:12px 20px 16px; --h-pass:var(--pass); --h-fail:var(--fail); --h-run:var(--running); --h-rest:var(--planned); --h-line:var(--line); }
  .sbar-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; }
  .sbar h1 { font:700 21px/1.25 var(--display); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sbar-actions { margin-left:auto; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .sbar-meta { margin:4px 0 0 0; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:2px 16px; align-items:center; }
  .sbar-meta .now { color:var(--body); display:inline-flex; align-items:center; gap:7px; }
  .sbar-meta .dot { background:var(--running); }
  .hero { display:grid; grid-template-columns:auto minmax(0,1fr) minmax(300px,400px); gap:10px 24px; align-items:center; margin-top:12px; }
  .ring { width:80px; height:80px; display:block; }
  .ring circle { fill:none; stroke-width:8; }
  .ring .ring-bg { stroke:var(--line); }
  .ring-n { fill:var(--ink); font:700 22px/1 var(--display); } .ring-l { fill:var(--muted); font:500 9.5px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase; }
  .tiles { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .tile { text-align:left; padding:7px 12px 8px; border:1px solid var(--line); border-top:3px solid var(--tc); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; min-width:0; transition:background .14s ease, border-color .14s ease; }
  .tile:hover { background:var(--sunk); }
  .tile[aria-pressed=true] { background:var(--accent-soft); border-color:var(--accent); border-top-color:var(--tc); }
  .tile b { display:block; font:700 26px/1.05 var(--display); letter-spacing:-.02em; color:var(--tc); }
  .tile span { display:block; margin-top:3px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-pass { --tc:var(--pass); } .t-fail { --tc:var(--fail); } .t-run { --tc:var(--running); } .t-rest { --tc:var(--planned); }
  .tile.zero b { color:var(--muted); }
  .pipe { display:flex; margin:0; padding:0; list-style:none; }
  .pipe li { position:relative; flex:1; min-width:0; text-align:center; padding-top:19px; font-size:11.5px; color:var(--muted); }
  .pipe li i { position:absolute; top:0; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:50%; border:2px solid var(--line); background:var(--surface); z-index:1; }
  .pipe li:not(:last-child)::after { content:""; position:absolute; top:6px; left:calc(50% + 9px); right:calc(-50% + 9px); height:2px; background:var(--line); }
  .pipe li.done { color:var(--body); } .pipe li.done i { background:var(--pass); border-color:var(--pass); } .pipe li.done::after { background:var(--pass) !important; }
  .pipe li.current { color:var(--ink); font-weight:700; } .pipe li.current i { border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 4px var(--ring); }
  .pipe li::after { transform-origin:left center; }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes pop { 0% { transform:scale(0); } 70% { transform:scale(1.25); } 100% { transform:scale(1); } }
  @keyframes halo { 0% { box-shadow:0 0 0 0 var(--ring); } 70%, 100% { box-shadow:0 0 0 9px transparent; } }
  @keyframes travel { from { left:calc(50% + 9px); opacity:0; } 15% { opacity:1; } 85% { opacity:1; } to { left:calc(150% - 9px - 16px); opacity:0; } }
  .pipe.enter li::after { animation:grow .45s ease-out both; animation-delay:calc(var(--i) * .16s + .1s); }
  .pipe.enter li i { animation:pop .35s ease-out both; animation-delay:calc(var(--i) * .16s); }
  .pipe li.current i { animation:halo 1.8s ease-out infinite; }
  .pipe li.flow::before { content:""; position:absolute; top:6px; left:calc(50% + 9px); width:16px; height:2px; border-radius:2px; background:var(--accent); z-index:1; animation:travel 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pipe li::after, .pipe li i, .pipe li.flow::before { animation:none !important; } }
  .pipe li span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pipe li small { display:block; font-size:10.5px; opacity:.8; min-height:1.3em; }
  .menu { position:relative; }
  .menu > summary { list-style:none; display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font-weight:500; font-size:13px; cursor:pointer; white-space:nowrap; }
  .menu > summary::-webkit-details-marker { display:none; }
  .menu > summary::after { content:"▾"; color:var(--muted); font-size:11px; }
  .menu[open] > summary, .menu > summary:hover { border-color:var(--muted); background:var(--sunk); }
  .menu-panel { position:absolute; right:0; top:calc(100% + 6px); z-index:30; width:min(380px, 88vw); max-height:70vh; overflow:auto; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); color:var(--body); }
  .menu-panel h4 { font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .menu-panel .btnrow { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .menu-panel hr { border:0; border-top:1px solid var(--line-soft); margin:12px 0; }
  .menu-panel textarea { min-height:48px; margin:6px 0; font-size:12.5px; }
  .menu-panel ul { margin:8px 0 0; padding:0; list-style:none; font-size:12.5px; }
  .menu-panel li { padding:3px 0; }

  /* ---------- screen 2: "AI needs you" inbox ---------- */
  .inbox { flex:none; padding:12px 20px; background:var(--accent-soft); border-bottom:1px solid var(--line); }
  .inbox-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; font:600 12px/1.4 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  .inbox-head .count { background:var(--accent); color:var(--accent-ink); border-radius:10px; padding:0 7px; font-size:11px; letter-spacing:0; }
  .inbox-list { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(min(420px,100%), 1fr)); }
  .ask { padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; min-width:0; }
  .ask h3, .ask .ask-h { font:600 13.5px/1.4 var(--sans); color:var(--ink); }
  .ask p { margin:4px 0 0; } .ask .q { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:4px; }
  .ask textarea { margin:8px 0 0; font-size:13px; }
  .ask-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .conflict { margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; }
  .conflict.undecided { border-left:3px solid var(--accent); }
  .conflict-h { font:600 13px/1.4 var(--sans); }
  .conflict-cmp { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .conflict-cmp p { margin:2px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  @media (max-width:700px) { .conflict-cmp { grid-template-columns:1fr; } }
  .ask.quiet { border-left-color:var(--blocked); }
  .ask details { margin-top:6px; } .ask summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
  .jump { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .jump button { height:26px; padding:0 9px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--ink); font:500 12px/1 var(--mono); cursor:pointer; }
  .jump button:hover { border-color:var(--accent); color:var(--accent); }
  pre.strategy { margin:8px 0 0; padding:12px 14px; max-height:200px; overflow:auto; background:var(--dark-soft); color:var(--on-dark); border-radius:6px; white-space:pre-wrap; font:400 12.5px/1.6 var(--mono); }
  .said { margin-top:6px; padding:6px 10px; border-left:3px solid var(--accent); background:var(--card); border-radius:0 6px 6px 0; font-size:13px; }
  .idle { padding:8px 12px; border:1px solid var(--line); border-left:3px solid var(--blocked); border-radius:6px; background:var(--card); font-size:13px; }

  /* ---------- screen 2: cases (left) | steps (right) ---------- */
  .workarea { flex:none; display:grid; grid-template-columns:minmax(280px,340px) minmax(0,1fr); align-items:start; }
  .case-column { min-width:0; background:var(--surface); border-right:1px solid var(--line); }
  .case-list { display:flex; flex-direction:column; min-height:0; }
  .case-list > header { display:flex; align-items:center; gap:8px; padding:10px 12px 8px 14px; }
  .case-list h2 { flex:1; font:600 13px/1.4 var(--sans); } .case-list h2 span { color:var(--muted); font-weight:500; margin-left:4px; }
  .case-toggle { width:26px; height:26px; padding:0; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--muted); cursor:pointer; line-height:1; }
  .case-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .case-filter { display:flex; gap:6px; padding:0 12px 10px; border-bottom:1px solid var(--line); }
  .case-filter input { flex:1 1 0; min-width:0; } .case-filter select { flex:0 0 auto; width:auto; }
  .layout.cases-collapsed .workarea { grid-template-columns:44px minmax(0,1fr); }
  .layout.cases-collapsed .case-list > header { padding:8px; justify-content:center; }
  .layout.cases-collapsed .case-list h2, .layout.cases-collapsed .case-filter, .layout.cases-collapsed .case-table-scroll { display:none; }
  .case-table-scroll:focus-visible { outline-offset:-3px; }
  table { width:100%; border-collapse:collapse; }
  .case-table thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .case-table, .case-table tbody { display:block; width:100%; }
  .case-table tr.case { display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"title title title" "id live tags" "prog prog att"; align-items:center; gap:2px 8px; position:relative; padding:9px 14px 10px; border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .case-table tr.case:hover { background:var(--card); }
  .case-table tr.case:focus-visible { outline-offset:-2px; }
  .case-table tr.case[aria-selected=true] { background:var(--accent-soft); }
  .case-table tr.case[aria-selected=true]::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
  .case-table tr.case td { display:block; padding:0; border:0; min-width:0; }
  .case-table td:nth-child(1) { grid-area:title; }
  .case-table td:nth-child(2) { grid-area:id; font-size:11.5px; color:var(--muted); }
  .case-table td:nth-child(3) { grid-area:prog; }
  .case-table td:nth-child(4) { grid-area:att; justify-self:end; font-size:11.5px; color:var(--muted); }
  .case-table td:nth-child(5) { grid-area:live; }
  .case-table td:nth-child(6) { grid-area:tags; justify-self:end; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .case-table .title { font-size:13px; font-weight:600; line-height:1.4; color:var(--ink); white-space:normal; overflow-wrap:anywhere; }
  .case-table tr.none, .case-table tr.none td { display:block; padding:16px 14px; color:var(--muted); }
  .ticks { display:inline-flex; flex-wrap:wrap; max-width:100%; gap:2px; vertical-align:middle; margin-right:6px; }
  .ticks i { flex:none; width:5px; height:10px; border-radius:2px; background:var(--line); }
  .ticks i.p { background:var(--pass); } .ticks i.f { background:var(--fail); } .ticks i.t { background:var(--repairing); animation:pulse 1s infinite; }
  .c-prog .muted { font-size:11.5px; }

  .detail-column { min-width:0; padding:16px 20px 40px; }
  .detail { display:grid; gap:14px; }
  .dhead { padding:14px 16px; }
  .dtitle { display:flex; align-items:baseline; gap:10px; }
  .dtitle h2 { font:600 17px/1.4 var(--display); min-width:0; }
  .dtitle .mono { font-weight:700; color:var(--accent); flex:none; }
  .dstatus { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:6px; }
  .dmeta { margin-top:6px; font-size:12px; color:var(--muted); }
  .dtools { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .dtools .grow { flex:1; }
  .opts { margin:0; } .opts summary { cursor:pointer; color:var(--muted); font-size:12.5px; padding:0 4px; }
  .opts-body { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-top:8px; width:100%; font-size:13px; }
  .opts-body label { display:inline-flex; align-items:center; gap:6px; }
  .opts-body input[type=number] { width:84px; height:28px; padding:0 8px; }
  .dtools .opts { flex-basis:100%; }
  .asks { display:grid; gap:10px; }
  .asks:empty { display:none; }
  .sec { display:flex; align-items:center; gap:10px; }
  .sec h3 { font:600 14px/1.4 var(--sans); } .sec .muted { font-size:12px; }
  .att-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-left:auto; }
  .att-tabs button { height:26px; padding:0 10px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--muted); cursor:pointer; font-size:12px; }
  .att-tabs button[aria-selected=true] { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .steps { padding:0 16px; }
  .step { display:grid; grid-template-columns:28px minmax(0,1fr) 132px; gap:12px; padding:14px 0; border-bottom:1px solid var(--line-soft); }
  .step:last-child { border-bottom:0; }
  .step.s-RUNNING, .step.s-TRYING { background:color-mix(in srgb, var(--c) 7%, transparent); margin:0 -16px; padding-left:16px; padding-right:16px; }
  .step .n { width:24px; height:24px; border:1.5px solid var(--c); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--c); font:600 12px/1 var(--mono); }
  .step.s-PASS .n { background:var(--c); color:var(--surface); }
  .step.s-FAIL .n { background:var(--c); color:var(--surface); }
  .step.s-PENDING .n, .step.s-NOT .n { border-color:var(--line); color:var(--muted); }
  .step .n .spin { margin:0; }
  .cap { font-weight:600; color:var(--ink); }
  .live-note { color:var(--c); font-weight:500; font-size:12.5px; margin-top:2px; }
  .kv { display:grid; grid-template-columns:84px minmax(0,1fr); gap:3px 10px; margin:6px 0 0; font-size:13px; }
  .kv dt { color:var(--muted); font-size:12px; padding-top:1px; } .kv dd { margin:0; }
  .kv .act { padding:5px 9px; border-left:3px solid var(--c); background:var(--sunk); border-radius:0 6px 6px 0; color:var(--ink); }
  .s-FAIL .kv .act { background:color-mix(in srgb, var(--fail) 9%, var(--surface)); }
  .thumb { width:132px; height:80px; border:1px solid var(--line); border-radius:6px; background:var(--sunk) center top/cover no-repeat; cursor:zoom-in; padding:0; position:relative; overflow:hidden; }
  .thumb.fail { border-color:var(--fail); }
  .thumb span { position:absolute; right:5px; bottom:5px; font:500 11px/1.4 var(--sans); padding:0 7px; background:rgba(15,18,24,.85); color:#eceef2; border-radius:9px; }
  .noimg { width:132px; height:80px; border:1px dashed var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; text-align:center; padding:4px; color:var(--muted); font-size:12px; }
  .fold { padding:0; } .fold > summary { padding:11px 16px; cursor:pointer; font-weight:600; color:var(--ink); font-size:13.5px; }
  .fold > summary .muted { font-weight:400; }
  .fold > :not(summary) { padding:0 16px 14px; }
  .fold ul, .fold ol { margin:6px 0 0; padding-left:20px; } .fold li { margin:2px 0; }
  .fold p { margin:6px 0; }
  .note { margin:10px 0 0; padding:10px 12px; border:1px solid var(--line); border-left:3px solid var(--repairing); border-radius:6px; background:var(--card); }
  .note h4 { font:600 13px/1.4 var(--sans); margin-bottom:6px; }
  .note dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; } .note dt { color:var(--muted); } .note dd { margin:0; }
  .hint-box h3 { font-size:13.5px; }

  /* ---------- live activity drawer ---------- */
  .drawer { position:fixed; top:48px; right:0; bottom:0; width:min(400px,100vw); z-index:15; display:flex; flex-direction:column; background:var(--surface); border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(0,0,0,.14); }
  .drawer > header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  .drawer h2 { font:600 14px/1.4 var(--sans); }
  .drawer-body { flex:1; overflow:auto; padding:12px 16px 24px; }
  .drawer details { margin:12px 0 0; } .drawer summary { cursor:pointer; color:var(--muted); font-weight:500; font-size:13px; }
  .live-mini { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:12.5px; color:var(--muted); }
  .live-chip { border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--ink); padding:2px 8px; font-size:12px; cursor:pointer; }
  .live-chip:hover { border-color:var(--accent); color:var(--accent); }
  .lb-free { margin:8px 0 0; padding:6px 10px; border-radius:6px; background:var(--sunk); font-size:12.5px; }
  .activity { margin:8px 0 0; padding:0; list-style:none; font-size:12.5px; }
  .activity li { padding:5px 0; border-bottom:1px solid var(--line-soft); overflow-wrap:anywhere; }
  .act-code { font-size:11.5px; white-space:normal; }

  /* ---------- scripts tab ---------- */
  .scripts-table { width:100%; border-collapse:collapse; background:var(--surface); }
  .scripts-table th, .scripts-table td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  .scripts-table th { font:600 11px/1.4 var(--sans); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); background:var(--sunk); }
  .scripts-table .res { font-weight:600; color:var(--c); } .scripts-table .res small { display:block; font-weight:400; color:var(--muted); }
  .script-steps ol { margin:8px 0; padding-inline-start:25px; }
  .script-steps li + li { margin-top:8px; }
  .script-steps pre { overflow:auto; max-height:280px; padding:8px; background:var(--sunk); }
  .s-CANCELLED { --c:var(--muted); }
  .scripts-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 14px; }
  #scriptsMain > .panel > header { display:grid; gap:4px; margin-bottom:16px; }
  #scriptsMain > .panel > header h2 { font:600 17px/1.4 var(--display); } #scriptsMain > .panel > header span { color:var(--muted); font-size:13px; }
  /*__SITE_MAP_CSS__*/

  .lightbox { position:fixed; inset:0; background:rgba(8,10,14,.94); display:none; flex-direction:column; z-index:40; }
  .lightbox.open { display:flex; }
  .lb-bar { display:flex; align-items:center; gap:10px; padding:12px 20px; color:var(--on-dark); }
  .lb-bar .grow { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-bar button { background:var(--dark-elev); color:var(--on-dark); border:1px solid #3a4150; border-radius:6px; height:34px; padding:0 14px; cursor:pointer; font-weight:500; }
  .lb-bar button[aria-pressed=true] { background:var(--on-dark); color:var(--dark); }
  .lb-body { flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding:0 20px 20px; }
  .lb-body img { max-width:100%; height:auto; background:#fff; border-radius:6px; }

  /* ---------- desktop: the whole page scrolls; the case list stays in view beside the steps ---------- */
  @media (min-width:861px) {
    .case-column { position:sticky; top:48px; max-height:calc(100dvh - 48px); overflow:auto; }
  }
  @media (max-width:1180px) {
    .workarea { grid-template-columns:minmax(260px,300px) minmax(0,1fr); }
    .step { grid-template-columns:28px minmax(0,1fr); } .step > .thumb, .step > .noimg { grid-column:2; width:100%; max-width:260px; }
  }
  @media (max-width:1180px) { .hero { grid-template-columns:auto minmax(0,1fr); } .pipe { grid-column:1 / -1; } }
  @media (max-width:980px) { .srow { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } .s-prog { grid-column:1 / -1; } }
  @media (max-width:860px) {
    .workarea { display:block; }
    .case-column { border-right:0; border-bottom:1px solid var(--line); }
    .case-table-scroll { max-height:38dvh; overflow:auto; }
    .detail-column { padding:14px 12px 28px; }
  }
  @media (max-width:767px) {
    .top { flex-wrap:wrap; gap:0 12px; padding:6px 12px 0; position:sticky; }
    .top .workspace-tabs { order:3; flex-basis:100%; } .workspace-tabs button { flex:1; height:40px; }
    .drawer { top:0; }
    .sbar, .inbox { padding-left:12px; padding-right:12px; }
    .page-in { padding:16px 12px 32px; }
    .seg { margin-left:0; }
    .srow { grid-template-columns:minmax(0,1fr); padding-right:40px; }
    #scriptsMain, #siteMapMain { padding:16px 12px 24px; }
    .kv { grid-template-columns:minmax(0,1fr); gap:0; } .kv dd { margin-bottom:6px; }
    .note dl { grid-template-columns:minmax(0,1fr); gap:2px; } .note dd { margin-bottom:6px; }
    .lb-bar { flex-wrap:wrap; gap:8px; padding:12px; } .lb-bar .grow { flex-basis:100%; }
    .detail-column .dtitle { flex-wrap:wrap; }
  }
  @media (max-width:480px) {
    .sbar-actions { margin-left:0; width:100%; }
    .hero { grid-template-columns:minmax(0,1fr); } .ring { display:none; } .tiles { grid-template-columns:repeat(2, minmax(0,1fr)); } .pipe li small { display:none; }
    .menu-panel { position:fixed; left:12px; right:12px; top:auto; width:auto; }
    .sbar-meta span:not(:first-child):not(.now) { display:none; }
  }
</style>
</head>
<body>
<div class="top"><b>Odoo Test</b><nav class="tabs workspace-tabs" role="tablist" aria-label="Workspace">
  <button id="tab-progress" role="tab" data-workspace-tab="progress" aria-selected="true" aria-controls="main">Danh sách phiên</button>
  <button id="tab-scripts" role="tab" data-workspace-tab="scripts" aria-selected="false" aria-controls="scriptsMain" tabindex="-1">Scripts</button>
  <button id="tab-site-map" role="tab" data-workspace-tab="site_map" aria-selected="false" aria-controls="siteMapMain" tabindex="-1">Sơ đồ màn hình</button>
</nav><div class="live" aria-live="polite"><span class="dot" id="dot"></span><span id="liveText">đang tải…</span></div></div>
<div class="layout">
  <main id="main" role="tabpanel" aria-labelledby="tab-progress"></main>
  <main id="scriptsMain" role="tabpanel" aria-labelledby="tab-scripts" hidden></main>
  <main id="siteMapMain" role="tabpanel" aria-labelledby="tab-site-map" hidden></main>
</div>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Ảnh bằng chứng">
  <div class="lb-bar"><span class="grow" id="lbTitle"></span>
    <button id="lbRaw" aria-pressed="false" title="Phím R">Ảnh gốc</button><button id="lbPrev" aria-label="Ảnh trước">←</button><button id="lbNext" aria-label="Ảnh sau">→</button><button id="lbClose">Đóng (Esc)</button></div>
  <div class="lb-body"><img id="lbImg" alt=""></div>
</div>

<script>
const TOKEN = "__TOKEN__";
const BOOT = __BOOT__;
const PHASE = { ANALYZE: "Phân tích", CONNECT: "Kết nối", CONFIRM: "Xác nhận", EXECUTE: "Thực thi", REPORT: "Báo cáo", DONE: "Xong" };
const STATUS = { INTERRUPTED: "Bị bỏ dở", STOPPED: "Đã dừng", PASS: "PASS", FAIL: "FAIL", PENDING: "PENDING", BLOCKED: "BLOCKED", RUNNING: "Đang chạy", REPAIRING: "Đang sửa lỗi", EXPLORING: "Đang xác thực", PLANNED: "Chờ xác thực", BUILT: "Chờ chạy", VERIFIED: "Đã xác thực", TRYING: "Đang thử", HELD: "Cần xử lý trước", NEW: "Mới", "NOT EXECUTED": "Chưa chạy" };
const ORDER = ["PASS", "FAIL", "REPAIRING", "RUNNING", "EXPLORING", "BUILT", "INTERRUPTED", "STOPPED", "PENDING", "BLOCKED", "PLANNED", "HELD", "NEW", "NOT EXECUTED"];
const S = { sig: "", histSig: "", open: {}, draft: {}, hintError: "", sessions: [], ws: "", sel: null, view: null, caseId: null, attempt: null, raw: false, gallery: [], index: 0, error: "", busy: false,
            sq: "", sfilter: "all", cq: "", cs: "", drawer: false };
S.replayTiming = { action_delay_ms: 700, step_delay_ms: 1500 };
S.videoMode = "fail";          // a plain re-run keeps the video only of a failure; the "Quay video" button always records, at a pace where the step notes can be read
const RECORD_TIMING = { action_delay_ms: 700, step_delay_ms: 1500 };
try {
  const saved = JSON.parse(localStorage.getItem("oqaReplayTiming") || "{}");
  for (const key of Object.keys(S.replayTiming)) {
    if (Number.isInteger(saved[key]) && saved[key] >= 0 && saved[key] <= 60000) S.replayTiming[key] = saved[key];
  }
} catch (e) {}
S.fast = false; S.fastPrev = { action_delay_ms: 700, step_delay_ms: 1500 };
try {
  const mode = JSON.parse(localStorage.getItem("oqaReplayFast") || "{}");
  if (mode.fast === true) {
    S.fast = true;
    for (const key of Object.keys(S.fastPrev)) if (Number.isInteger(mode.prev?.[key]) && mode.prev[key] >= 0 && mode.prev[key] <= 60000) S.fastPrev[key] = mode.prev[key];
    S.replayTiming.action_delay_ms = 0; S.replayTiming.step_delay_ms = 0;
  }
} catch (e) {}
const saveFast = () => { try { localStorage.setItem("oqaReplayFast", JSON.stringify({ fast: S.fast, prev: S.fastPrev })); } catch (err) {} };
const RSTATUS = { PASS: "Replay PASS", FAIL: "Replay FAIL", CANCELLED: "Replay đã hủy", "NOT RUN": "Replay NOT RUN" };
const replayTag = k => ["PASS", "FAIL"].includes(k.live_status) ? `<span class="tag ${k.replay_status === "FAIL" ? "attn" : ""}" title="${esc(k.replay && k.replay.at || "Chưa chạy lại script")}">${RSTATUS[k.replay_status] || k.replay_status}</span>` : "";
S.workspaces = []; S.tab = "progress"; S.casesCollapsed = false;
try { S.casesCollapsed = localStorage.getItem("oqaCasesCollapsed") === "1"; } catch (e) {}
const M = { ws: "", lang: "", q: "", kind: "", key: "", mode: "buttons", view: "", match: "", required: false, data: null, results: null, screen: null, loading: false, error: "", request: 0, detailRequest: 0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cls = s => "s-" + String(s).split(" ")[0];
const LIVE = ["RUNNING", "REPAIRING", "EXPLORING", "TRYING"];          // the server only sends these while something is really working (see view.py)
const ICON = {
  check: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>',
  x: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  minus: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M5.5 8h5"/></svg>',
  ring: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.5"/></svg>',
};
const stIcon = s => LIVE.includes(s) ? '<i class="spin"></i>'
  : `<span class="si">${["PASS", "VERIFIED"].includes(s) ? ICON.check : s === "FAIL" ? ICON.x : ["BLOCKED", "STOPPED", "INTERRUPTED", "HELD"].includes(s) ? ICON.minus : ICON.ring}</span>`;
const get = path => fetch(path + (path.includes("?") ? "&" : "?") + "t=" + TOKEN).then(r => r.json());
const post = (path, body) => fetch(path + "?t=" + TOKEN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json());
const img = (path) => `/api/image?ws=${encodeURIComponent(S.sel.ws)}&id=${encodeURIComponent(S.sel.id)}&path=${encodeURIComponent(path)}&t=${TOKEN}`;
const clock = ts => (ts || "").slice(11, 16);
const day = ts => (ts || "").slice(0, 10);
const baseName = file => String(file || "").split(/[\\/]/).pop();

function bar(counts, total) {
  const parts = ORDER.filter(k => counts[k]).map(k => `<i class="${cls(k)}" style="flex:${counts[k]}" title="${esc(STATUS[k] || k)} ${counts[k]}"></i>`).join("");
  return `<div class="bar" role="img" aria-label="${total} case">${parts}</div>`;
}

/** Replacing a panel's HTML empties it for an instant, and the browser then forgets how far it was scrolled. Put every scroll position back after a redraw. */
function scrollers() { return ["#main", ".page", ".detail-column", ".case-column", "#caseListBody", ".inbox", "pre.strategy", ".drawer-body"].map(sel => document.querySelector(sel)); }
function keepScroll(draw) {
  const before = scrollers().map(el => ({ top: el?.scrollTop || 0, left: el?.scrollLeft || 0 }));
  const winTop = window.scrollY;
  draw();
  scrollers().forEach((el, i) => { if (el) { el.scrollTop = before[i].top; el.scrollLeft = before[i].left; } });
  window.scrollTo(0, winTop);
}
const isOpen = (key, fallback) => ((key in S.open ? S.open[key] : fallback) ? "open" : "");

function toggleCases(force) {
  const on = force === undefined ? !S.casesCollapsed : force;
  S.casesCollapsed = on;
  document.querySelector(".layout")?.classList.toggle("cases-collapsed", on);
  const btn = $("caseToggle");
  if (btn) {
    btn.textContent = on ? "»" : "«";
    btn.setAttribute("aria-expanded", String(!on));
    btn.setAttribute("aria-label", on ? "Mở danh sách testcase" : "Thu gọn danh sách testcase");
    btn.title = on ? "Mở danh sách testcase" : "Thu gọn danh sách testcase";
  }
  try { localStorage.setItem("oqaCasesCollapsed", on ? "1" : "0"); } catch (e) {}
}
toggleCases(S.casesCollapsed);

/* ================= screen 1: the session list ================= */
const needsYou = s => !!(s.waiting || s.reviews > 0 || s.can_confirm || s.conflicts_pending > 0 || s.stopped);
const sessionGroup = s => needsYou(s) ? "need" : (s.phase === "EXECUTE" && !s.idle) ? "run" : "rest";
const whyNeeds = s => s.waiting ? "AI đang hỏi bạn" : s.conflicts_pending > 0 ? `${s.conflicts_pending} chỗ testcase lệch BD cần bạn chọn` : s.can_confirm ? "Chiến lược chờ duyệt" : s.reviews > 0 ? `${s.reviews} case cần xác nhận` : s.stopped ? "Đã dừng" : "";

function sessionRow(s) {
  const cur = S.sel && S.sel.ws === s.workspace && S.sel.id === s.session;
  const c = s.counts || {}, running = (c.RUNNING || 0) + (c.REPAIRING || 0) + (c.EXPLORING || 0);
  const why = whyNeeds(s);
  const state = `${why ? `<span class="tag attn">${esc(why)}</span>` : ""}<span class="tag">${esc(PHASE[s.phase])}</span>${s.idle && !why ? `<span class="tag" title="Không có hoạt động ${s.idle_hours} giờ">Bỏ dở?</span>` : ""}${s.phase === "EXECUTE" && s.workers ? `<span class="muted" style="font-size:12px">${s.workers} worker</span>` : ""}`;
  return `<div class="srow-wrap"><button class="srow ${needsYou(s) ? "need" : ""}" data-ws="${esc(s.workspace)}" data-id="${esc(s.session)}" aria-current="${cur}">
      <div style="min-width:0"><div class="s-name" title="${esc(s.file)}">${esc(baseName(s.file))}</div><div class="s-sub">${esc(s.workspace)} · ${esc(day(s.created))} ${esc(clock(s.created))}</div></div>
      <div class="s-state">${state}</div>
      <div class="s-prog">${bar(c, s.total)}<div class="s-nums"><span class="p"><b>${c.PASS || 0}</b> PASS</span><span class="f"><b>${c.FAIL || 0}</b> FAIL</span>${running ? `<span><b>${running}</b> đang chạy</span>` : ""}<span>${s.total} case</span></div></div>
    </button><button class="del" data-del-ws="${esc(s.workspace)}" data-del-id="${esc(s.session)}" title="Xoá phiên này" aria-label="Xoá phiên ${esc(baseName(s.file))}">×</button></div>`;
}

function drawSessionList() {
  const box = $("sessList");
  if (!box) return;
  const q = S.sq.trim().toLowerCase();
  const list = S.sessions.filter(s => (!S.ws || s.workspace === S.ws) && (!q || baseName(s.file).toLowerCase().includes(q))
    && (S.sfilter === "all" || (S.sfilter === "need" && sessionGroup(s) === "need") || (S.sfilter === "run" && sessionGroup(s) === "run") || (S.sfilter === "done" && ["REPORT", "DONE"].includes(s.phase))));
  if (!list.length) { box.innerHTML = `<div class="empty"><b>${S.sessions.length ? "Không có phiên nào khớp" : "Chưa có phiên test nào"}</b>${S.sessions.length ? "Thử đổi bộ lọc hoặc từ khoá." : "Mỗi yêu cầu test là một phiên. Hãy bảo AI test một file testcase."}</div>`; return; }
  const groups = [["need", "Cần bạn xử lý"], ["run", "Đang chạy"], ["rest", "Các phiên khác"]];
  box.innerHTML = groups.map(([key, title]) => {
    const rows = list.filter(s => sessionGroup(s) === key);
    return rows.length ? `<h2 class="group ${key}">${title} <span class="count">${rows.length}</span></h2>${rows.map(sessionRow).join("")}` : "";
  }).join("");
}

function drawSessions() {
  const names = [...new Set([...S.workspaces.map(w => w.name), ...S.sessions.map(s => s.workspace)])];
  const segs = [["all", "Tất cả"], ["need", "Cần bạn"], ["run", "Đang chạy"], ["done", "Đã xong"]];
  $("main").innerHTML = `<div class="page"><div class="page-in">
    <div class="page-head"><h1>Danh sách phiên</h1><p class="muted">Mỗi yêu cầu test là một phiên. Chọn một phiên để xem testcase và kết quả.</p></div>
    <div class="toolbar"><select id="wsFilter" aria-label="Lọc theo workspace"><option value="">Tất cả workspace</option>${names.map(n => `<option ${n === S.ws ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <input id="sessQ" type="search" aria-label="Tìm theo tên file" placeholder="Tìm theo tên file" value="${esc(S.sq)}">
      <div class="seg" role="group" aria-label="Lọc theo trạng thái">${segs.map(([key, label]) => `<button type="button" data-sfilter="${key}" aria-pressed="${S.sfilter === key}">${label}</button>`).join("")}</div></div>
    <div id="sessList"></div></div></div>`;
