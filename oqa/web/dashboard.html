function renderHistory() { if (!S.sel) renderMain(); }

/* ================= screen 2: one session ================= */
function renderMain() { keepScroll(drawMain); }

function refsPanel(v) {
  if (v.phase === "DONE") return "";
  const list = (v.refs || []).map(r => `<li><span class="mono">${esc(r.name)}</span> <span class="muted">${r.kind === "folder" ? "thư mục" : "tệp"} · ${esc(r.path)}${r.case ? " · case " + esc(r.case) : ""}</span></li>`).join("");
  return `<section class="refs-panel"><h4>Tệp tham chiếu cho AI</h4><div class="muted" style="font-size:12.5px">Thiết kế (BD), đặc tả, file import… Dán đường dẫn trên máy này (mỗi dòng một đường dẫn), AI tự đọc.</div>
      <textarea id="refPath" aria-label="Đường dẫn tệp hoặc thư mục" placeholder="C:\\Users\\bạn\\Documents\\BD_man_hinh_don_hang.xlsx"></textarea>
      <button class="btn sm" id="addRef" title="Thêm đường dẫn" ${S.busy ? "disabled" : ""}>Thêm đường dẫn</button>${list ? `<ul>${list}</ul>` : ""}</section>`;
}

/** Cases currently being worked on, the ones no agent has picked up, and the agents' notes. Lives in the activity drawer. */
function liveBoard(v) {
  const active = v.cases.filter(k => k.status === "EXPLORING" || k.status === "RUNNING" || k.status === "REPAIRING" || (k.explore && k.explore.trying));
  const free = (v.free_cases || []).filter(id => !active.some(k => k.id === id));
  const freeLine = free.length ? `<div class="lb-free">Chưa có agent nhận: ${free.map(id => `<b class="mono">case ${esc(id)}</b>`).join(", ")}</div>` : "";
  const notes = (v.notes || []).length ? `<details data-key="notes" ${isOpen("notes", false)}><summary>Ghi chú chung (${v.notes.length})</summary><ul class="activity">${v.notes.map(n => `<li><span class="mono">${esc(String(n.ts).slice(11, 19))}</span> <b>${esc(n.agent)}</b>${n.case ? " · case " + esc(n.case) : ""}: ${esc(n.text)}</li>`).join("")}</ul></details>` : "";
  if (!active.length) return freeLine || notes ? `<div>${freeLine}${notes}</div>` : "";
  const rows = active.map(k => {
    const total = k.planned.length || 1, ex = k.explore || { verified: [], trying: null };
    const run = k.attempts.length ? k.attempts[k.attempts.length - 1] : null;
    const done = run ? run.steps.filter(s => s.status === "PASS").length : ex.verified.length;
    return `<button type="button" class="live-chip" data-case-jump="${esc(k.id)}" title="${esc(k.title || "")}${k.owner ? " · " + esc(k.owner) : ""}">case ${esc(k.id)} · ${done}/${total} bước</button>`;
  }).join("");
  return `<div class="live-mini"><b>Đang chạy ${active.length}:</b>${rows}</div>${freeLine}${notes}`;
}

function activityPanel(v) {
  const rows = (v.activity || []).map(a => {
    const when = String(a.ts || "").slice(11, 19);
    const what = a.kind === "try_started" ? (a.mode === "replay" ? "chạy lại các bước đã xác nhận" : `bắt đầu thử bước ${a.step}`)
      : a.kind === "explore" ? (a.ok ? `bước ${a.step} đã thử xong, đạt` : `bước ${a.step} thử chưa đạt: ${a.error}`)
      : a.kind === "built" ? "đã dựng script"
      : a.kind === "case_started" ? "bắt đầu chạy case"
      : a.kind === "attempt_finished" ? `lần chạy kết thúc: ${a.status}${a.error ? " (" + a.error + ")" : ""}`
      : a.kind === "repair" ? `ghi nhận sửa: ${a.cause}` : a.kind;
    const code = a.kind === "explore" && a.code ? `<div class="muted mono act-code">${esc(a.code.replace(/\s+/g, " "))}</div>` : "";
    return `<li><span class="mono">${esc(when)}</span> <b class="mono">case ${esc(a.case)}</b> ${esc(what)}${code}</li>`;
  }).join("");
  if (!rows) return "";
  return `<details data-key="activity" ${isOpen("activity", true)}><summary>Hoạt động (mọi agent, mọi case)</summary><ul class="activity">${rows}</ul></details>`;
}

const needsHint = k => !!(k.can_hint && k.exhausted);
const workerFailed = k => !!(k.request && k.request.failure && k.status !== "PASS");
const caseJump = list => `<div class="jump">${list.slice(0, 12).map(k => `<button type="button" data-case-jump="${esc(k.id)}" title="${esc(k.title || "")}">${esc(k.id)}</button>`).join("")}${list.length > 12 ? `<span class="muted">+${list.length - 12}</span>` : ""}</div>`;

/** Where a testcase differs from its BD. The BD is the default but may itself be wrong, so the user chooses for each one: follow the BD or follow the testcase. Nothing can be confirmed before. */
function conflictPanel(v) {
  const rows = v.conflicts.map(c => {
    const pick = (choice, label) => `<button type="button" class="btn ${c.choice === choice ? "primary" : ""}" data-conflict-case="${esc(c.case)}" data-conflict-step="${c.step}" data-conflict-choice="${choice}" aria-pressed="${c.choice === choice}" ${S.busy ? "disabled" : ""}>${label}</button>`;
    return `<div class="conflict ${c.choice ? "decided" : "undecided"}">
      <div class="conflict-h"><button type="button" class="link" data-case-jump="${esc(c.case)}">${esc(c.case)}</button> · bước ${c.step} <span class="muted">· ${esc(c.ref)}</span></div>
      <div class="conflict-cmp"><div><b>BD nói</b><p>${esc(c.bd)}</p></div><div><b>Testcase nói</b><p>${esc(c.testcase)}</p></div></div>
      <div class="ask-actions">${pick("bd", "Theo BD")}${pick("testcase", "Theo testcase")}<span class="muted">${c.choice ? "Đã chọn, bấm lại để đổi." : "Chưa chọn."}</span></div></div>`;
  }).join("");
  return `<section class="ask attn-panel"><h3>Testcase lệch BD: ${v.conflicts_pending > 0 ? `${v.conflicts_pending}/${v.conflicts.length} chỗ cần bạn chọn` : "đã chọn hết"}</h3>
    <p class="muted">Mặc định BD thắng, nhưng BD cũng có thể sai hoặc đã cũ. Chọn test theo BD hay theo testcase cho từng chỗ. Chưa chọn hết thì không duyệt được chiến lược.</p>${rows}<div class="err">${esc(S.error)}</div></section>`;
}

/** Everything the AI is waiting on, in one place that is always in view. Each item says what is asked and carries its own answer button. */
function inboxItems(v) {
  const items = [];
  const err = `<div class="err">${esc(S.error)}</div>`;
  if (v.stopped) items.push(`<section class="ask attn-panel"><h3>Bạn đã dừng test</h3><p class="muted">Bước đang chạy được hoàn tất, AI đang đợi.</p><div class="ask-actions"><button class="btn primary" id="resume" ${S.busy ? "disabled" : ""}>Tiếp tục test</button></div>${err}</section>`);
  else if (v.waiting && v.waiting.review) {
    const pending = v.cases.filter(k => k.review_pending);
    items.push(`<section class="ask attn-panel"><h3>Rà soát testcase: ${pending.length} case cần bạn xác nhận</h3><p class="muted">Mở từng case, trả lời câu hỏi của AI hoặc bỏ qua.</p>${caseJump(pending)}</section>`);
  } else if (v.waiting) items.push(`<section class="ask attn-panel"><h3>AI đang chờ bạn trả lời${v.waiting.case ? ` <span class="muted" style="font-weight:400">· case ${esc(v.waiting.case)}</span>` : ""}</h3><div class="q">${esc(v.waiting.question)}</div>
      <textarea id="answer" aria-label="Câu trả lời" placeholder="Dán thẳng đường dẫn tệp vào đây nếu cần thiết kế, file import… AI tự đọc."></textarea><div class="ask-actions"><button class="btn primary" id="sendAnswer" ${S.busy ? "disabled" : ""}>Gửi trả lời</button></div>${err}</section>`);
  else if (v.can_confirm) items.push(`<section class="ask attn-panel"><h3>Chiến lược chờ duyệt</h3><p class="muted">Xem thứ tự chạy và dữ liệu dự phòng trước khi cho AI chạy.</p>
      <details data-key="strategy" ${isOpen("strategy", true)}><summary>Nội dung chiến lược</summary><pre class="strategy">${esc(v.strategy)}</pre></details>
      ${v.conflicts_pending > 0 ? `<p class="err">Còn ${v.conflicts_pending} chỗ testcase lệch BD chưa chọn. Chọn xong mới duyệt được.</p>` : ""}
      <div class="ask-actions"><button class="btn primary" id="confirm" ${S.busy || v.conflicts_pending > 0 ? "disabled" : ""}>Xác nhận và bắt đầu test</button></div>${err}</section>`);
  if (["ANALYZE", "CONNECT", "CONFIRM"].includes(v.phase) && (v.conflicts || []).length) items.unshift(conflictPanel(v));
  const hint = v.cases.filter(needsHint);
  if (hint.length) items.push(`<section class="ask"><h3>AI cần gợi ý của bạn (${hint.length} case)</h3><p class="muted">Các case này đã hết số lần tự sửa.</p>${caseJump(hint)}</section>`);
  const broken = v.cases.filter(workerFailed);
  if (broken.length) items.push(`<section class="ask"><h3>Worker gặp lỗi (${broken.length} case)</h3><p class="muted">Chưa phải kết luận của case. Mở case để giao lại.</p>${caseJump(broken)}</section>`);
  if (v.idle && !v.waiting) items.push(`<section class="ask quiet"><div class="ask-h">Không có hoạt động ${Math.floor(v.idle_hours)} giờ nay</div><p class="muted">Bảo AI chạy <span class="mono">oqa status</span> để tiếp tục.</p></section>`);
  return items;
}
function inboxHtml(v) {
  const items = inboxItems(v), urgent = items.length - (v.idle && !v.waiting ? 1 : 0);
  return items.length ? `<section class="inbox" aria-label="Cần bạn xử lý"><div class="inbox-head">Cần bạn xử lý ${urgent > 0 ? `<span class="count">${urgent}</span>` : ""}</div><div class="inbox-list">${items.join("")}</div></section>` : "";
}

function stepsDone(k) {
  const ex = k.explore || { verified: [], trying: null };
  const last = k.attempts.length ? k.attempts[k.attempts.length - 1].steps : k.planned.map(p => ({ status: ex.trying && ex.trying.step === p.n ? "TRYING" : ex.verified.includes(p.n) ? "PASS" : "PENDING" }));
  return last;
}
function ticks(c) {
  const last = stepsDone(c), done = last.filter(s => s.status === "PASS").length;
  return `<span class="ticks">${last.map(s => `<i class="${s.status === "PASS" ? "p" : s.status === "FAIL" ? "f" : s.status === "TRYING" ? "t" : ""}"></i>`).join("")}</span><span class="muted">${done}/${last.length}</span>`;
}

function caseTags(k, v) {
  return k.review_pending ? '<span class="tag attn">Need confirm</span>'
    : needsHint(k) ? '<span class="tag attn">Cần gợi ý</span>'
    : workerFailed(k) ? '<span class="tag attn">Worker lỗi</span>'
    : k.review_skipped ? '<span class="tag">Đã bỏ qua</span>'
    : k.verdict === "ready" && v.phase === "ANALYZE" ? '<span class="tag">Ready</span>' : replayTag(k);
}
function caseRow(k, v) {
  const who = k.owner_fresh && k.owner ? ` · ${esc(k.owner)}` : "";
  return `<tr class="case ${cls(k.status)}" tabindex="0" data-id="${esc(k.id)}" aria-selected="${k.id === S.caseId}">
      <td><div class="title">${esc(k.title)}</div></td><td class="mono case-id">${esc(k.id)}</td><td class="c-prog">${ticks(k)}</td>
      <td>${k.attempts.length ? `Lần ${k.attempts.length}` : ""}${who}</td><td><span class="status">${stIcon(k.status)}${esc(STATUS[k.status] || k.status)}</span></td><td>${caseTags(k, v)}</td></tr>`;
}
function caseMatches(k) {
  const q = S.cq.trim().toLowerCase();
  if (q && !(k.id + " " + k.title).toLowerCase().includes(q)) return false;
  if (!S.cs) return true;
  if (S.cs === "need") return k.review_pending || needsHint(k) || workerFailed(k);
  if (S.cs === "LIVE") return LIVE.includes(k.status);
  if (S.cs === "TODO") return k.status !== "PASS" && k.status !== "FAIL" && !LIVE.includes(k.status);
  return k.status === S.cs;
}
function drawCaseRows() {
  const v = S.view, body = $("caseRows");
  if (!v || !body) return;
  const list = v.cases.filter(caseMatches);
  body.innerHTML = list.map(k => caseRow(k, v)).join("") || '<tr class="none"><td>Không có testcase khớp bộ lọc.</td></tr>';
  $("caseCount").textContent = list.length === v.cases.length ? v.cases.length : `${list.length}/${v.cases.length}`;
}

/** A donut of the whole run: green passed, red failed, blue running, the rest of the ring is what has no conclusion yet. */
function ring(passed, failed, running, total, settled) {
  const R = 34, C = 2 * Math.PI * R;
  let off = 0;
  const seg = (n, color) => {
    if (!n || !total) return "";
    const len = C * n / total, svg = `<circle cx="42" cy="42" r="${R}" style="stroke:${color}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len;
    return svg;
  };
  const pct = total ? Math.round(passed * 100 / total) : 0;
  return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="${passed} PASS, ${failed} FAIL, ${settled} trên ${total} case có kết luận"><circle class="ring-bg" cx="42" cy="42" r="${R}"/>
    <g transform="rotate(-90 42 42)">${seg(passed, "var(--h-pass)")}${seg(failed, "var(--h-fail)")}${seg(running, "var(--h-run)")}</g>
    <text class="ring-n" x="42" y="45" text-anchor="middle">${pct}%</text><text class="ring-l" x="42" y="59" text-anchor="middle">đạt</text></svg>`;
}

function sessionBar(v) {
  const total = v.total, c = v.counts, passed = c.PASS || 0, failed = c.FAIL || 0;
  const settled = ["PASS", "FAIL", "BLOCKED", "PENDING", "NOT EXECUTED"].reduce((n, k) => n + (c[k] || 0), 0);
  const running = LIVE.reduce((n, k) => n + (c[k] || 0), 0), other = Math.max(0, total - passed - failed - running);
  const canReplay = v.cases.some(k => k.can_replay);
  const rc = v.replay_counts || {};
  const replaySummary = ["PASS", "FAIL", "CANCELLED", "NOT RUN"].filter(k => rc[k]).map(k => `${rc[k]} ${k === "CANCELLED" ? "đã hủy" : k}`).join(" · ");
  const flowing = v.phase !== "DONE" && !v.stopped, lastDone = v.phases.reduce((at, p, i) => p.state === "done" ? i : at, -1);
  const pipe = v.phases.map((p, i) => `<li class="${p.state}${flowing && i === lastDone ? " flow" : ""}" style="--i:${i}"><i></i><span>${esc(PHASE[p.phase])}</span><small>${p.at ? esc(clock(p.at)) : ""}</small></li>`).join("");
  const enter = S.pipeShown !== v.session;          // the timeline draws itself once when a session is opened, not on every refresh
  S.pipeShown = v.session;
  const stat = (key, cls, n, label) => `<button type="button" class="tile ${cls}${n ? "" : " zero"}" data-stat="${key}" aria-pressed="${S.cs === key}" title="Lọc danh sách testcase: ${esc(label)}"><b>${n}</b><span>${esc(label)}</span></button>`;
  const live = v.phase === "EXECUTE" && !v.stopped;
  const showReplay = canReplay && ["REPORT", "DONE"].includes(v.phase);
  const main = v.reports.find(r => r.main);
  const reportLabel = main ? "Cập nhật báo cáo Excel" : "Xuất báo cáo Excel";
  return `<header class="sbar">
    <div class="sbar-row sbar-title">
      <h1 title="${esc(v.file)}">${esc(baseName(v.file))}</h1><span class="tag">${v.stopped ? "Đã dừng" : esc(PHASE[v.phase])}</span>
      <div class="sbar-actions">
        ${v.activity.length || v.phase === "EXECUTE" ? `<button class="btn" id="openActivity" type="button" aria-expanded="${S.drawer}">Hoạt động</button>` : ""}
        ${showReplay ? `<details class="menu" data-key="menu-replay" ${isOpen("menu-replay", false)}><summary>Chạy lại</summary><div class="menu-panel"><h4>Replay script đã lưu</h4>
          <div class="btnrow"><button class="btn" data-replay-all="1" title="Chạy lại script của tất cả case đã lưu script">Chạy lại tất cả</button><button class="btn primary" data-replay-all="1" data-record="1" title="Chạy lại tất cả case đã lưu script và quay video có chú thích từng bước">Quay video tất cả</button></div>
          ${replaySummary ? `<div class="muted" style="font-size:12.5px">Kết quả replay: ${esc(replaySummary)}</div>` : ""}</div></details>` : ""}
        <details class="menu" data-key="menu-report" ${isOpen("menu-report", false)}><summary>Báo cáo &amp; tệp</summary><div class="menu-panel"><h4>Báo cáo</h4>
          <div class="btnrow"><button class="btn ${main ? "" : "primary"}" id="exportReport" title="${esc(reportLabel)}" ${S.busy ? "disabled" : ""}>${reportLabel}</button>
            ${main ? `<a class="btn primary" href="${reportUrl(main.name)}" download>Tải file Evidence (.xlsx)</a>` : ""}
            ${canReplay ? `<a class="btn" href="${reportUrl("").replace("/api/report?", "/api/scripts?")}" download>Tải ZIP script</a>` : ""}</div>
          ${v.phase === "DONE" ? "" : `<hr>${refsPanel(v)}`}</div></details>
        ${v.phase === "EXECUTE" && v.can_stop ? `<button class="btn danger" id="stop" ${S.busy ? "disabled" : ""}>Dừng test</button>` : ""}
      </div></div>
    <div class="sbar-meta"><span>${esc(v.workspace)}</span><span>Bắt đầu ${esc(v.created)}</span>${v.connect && v.connect.version ? `<span>Odoo ${esc(v.connect.version)}</span>` : ""}<span class="mono" title="Mã phiên">${esc(v.session)}</span>${replaySummary ? `<span>Replay: ${esc(replaySummary)}</span>` : ""}${v.now ? `<span class="now">${live ? '<i class="dot on"></i>' : ""}${esc(v.now)}</span>` : ""}</div>
    <div class="hero">${ring(passed, failed, running, total, settled)}
      <div class="tiles" role="group" aria-label="Kết quả theo trạng thái. Bấm để lọc danh sách testcase.">${stat("PASS", "t-pass", passed, "PASS")}${stat("FAIL", "t-fail", failed, "FAIL")}${stat("LIVE", "t-run", running, v.workers && running ? `Đang chạy · ${v.workers.active}/${v.workers.limit} worker` : "Đang chạy")}${stat("TODO", "t-rest", other, "Chưa có kết luận")}</div>
      <ol class="pipe${enter ? " enter" : ""}" aria-label="Giai đoạn của phiên">${pipe}</ol>
</div>
  </header>`;
}

function drawerHtml(v) {
  return `<aside class="drawer" aria-label="Hoạt động trực tiếp"><header><h2>Hoạt động trực tiếp</h2><button class="btn sm" id="closeActivity" type="button">Đóng</button></header>
    <div class="drawer-body">${liveBoard(v) || ""}${activityPanel(v) || '<p class="muted">Chưa có hoạt động nào.</p>'}</div></aside>`;
}

function drawMain() {
  if (!S.sel) return drawSessions();
  const v = S.view;
  if (!v) { $("main").innerHTML = '<div class="empty"><b>Đang tải phiên…</b></div>'; return; }
  const statusOpts = [["", "Tất cả"], ["need", "Cần bạn"], ["FAIL", "FAIL"], ["LIVE", "Đang chạy"], ["PASS", "PASS"], ["TODO", "Chưa xong"]];
  $("main").innerHTML = `${sessionBar(v)}${inboxHtml(v)}
    <div class="workarea">
      <section class="case-column"><section class="case-list" aria-labelledby="caseListTitle">
        <header><h2 id="caseListTitle">Testcase <span id="caseCount">${v.total}</span></h2><button type="button" id="caseToggle" class="case-toggle" aria-controls="caseListBody" aria-expanded="${!S.casesCollapsed}" aria-label="${S.casesCollapsed ? "Mở danh sách testcase" : "Thu gọn danh sách testcase"}" title="${S.casesCollapsed ? "Mở danh sách testcase" : "Thu gọn danh sách testcase"}">${S.casesCollapsed ? "»" : "«"}</button></header>
        <div class="case-filter"><input id="caseQ" type="search" aria-label="Tìm testcase" placeholder="Tìm testcase" value="${esc(S.cq)}"><select id="caseStatus" aria-label="Lọc theo trạng thái">${statusOpts.map(([key, label]) => `<option value="${key}" ${S.cs === key ? "selected" : ""}>${label}</option>`).join("")}</select></div>
        <div class="case-table-scroll" id="caseListBody" role="region" aria-label="Danh sách testcase trong phiên" tabindex="0"><table class="case-table"><thead><tr><th scope="col">Tên testcase</th><th scope="col">Mã</th><th scope="col">Bước</th><th scope="col">Lần</th><th scope="col">Live</th><th scope="col">Ghi chú</th></tr></thead><tbody id="caseRows"></tbody></table></div>
      </section></section>
      <section class="detail-column"><div class="detail" id="detail"></div></section>
    </div>${S.drawer ? drawerHtml(v) : ""}`;
  toggleCases(S.casesCollapsed);
  drawCaseRows();
  renderDetail();
  restoreDrafts();
}

function renderDetail() {
  const box = $("detail");
  if (!box) return;
  drawDetail(box);
}

function drawDetail(box) {
  const v = S.view, k = v && v.cases.find(x => x.id === S.caseId);
  if (!k) { box.innerHTML = '<div class="empty"><b>Chưa có testcase nào</b>Phiên này chưa có testcase.</div>'; return; }
  const att = k.attempts.find(a => a.n === S.attempt) || k.attempts[k.attempts.length - 1];
  const ex = k.explore || { verified: [], trying: null };
  const steps = att ? att.steps : k.planned.map(p => ({ ...p, images: [], actual: "",
    status: ex.trying && ex.trying.step === p.n ? "TRYING" : ex.verified.includes(p.n) ? "VERIFIED" : "PENDING", mode: ex.trying && ex.trying.step === p.n ? ex.trying.mode : "" }));
  S.gallery = steps.flatMap(s => s.images.map(im => ({ ...im, caption: im.caption || `Bước ${s.n}: ${s.caption}` })));
  const meta = [k.profile && `Profile ${k.profile}`, k.depends_on.length && `Tiếp từ ${k.depends_on.join(", ")}`, k.clarity && `Rõ ràng ${k.clarity}/5`, k.sufficiency && `Đủ dữ kiện ${k.sufficiency}/5`, `Dòng ${k.row}`].filter(Boolean).map(esc).join(" · ");
  const tabs = k.attempts.length > 1 ? `<div class="att-tabs" role="tablist" aria-label="Các lần chạy">${k.attempts.map(a => `<button role="tab" data-attempt="${a.n}" aria-selected="${att && a.n === att.n}">Lần ${a.n} · ${esc(STATUS[a.status] || a.status)}${a.from_step > 1 ? ` · từ bước ${a.from_step}` : ""}</button>`).join("")}</div>` : "";
  const done = steps.filter(s => ["PASS", "VERIFIED"].includes(s.status)).length;
  let g = -1;
  const list = steps.map(s => {
    const first = s.images[0];
    const thumb = first ? `<button class="thumb ${s.status === "FAIL" ? "fail" : ""}" data-g="${(g += s.images.length) - s.images.length + 1}" style="background-image:url('${img(first.annotated)}')" aria-label="Phóng to ảnh bước ${s.n}"><span>${s.images.length > 1 ? s.images.length + " ảnh" : "xem"}</span></button>` : `<div class="noimg">${{ PENDING: att ? "chưa chạy" : "chờ xác thực", RUNNING: "đang chạy…", TRYING: "đang thử…", VERIFIED: "đã thử trên trang thật" }[s.status] || "không có ảnh"}</div>`;
    const showActual = s.actual && s.status !== "PENDING";
    return `<div class="step ${cls(s.status)}"><div class="n" title="${esc(STATUS[s.status] || s.status)}">${LIVE.includes(s.status) ? '<i class="spin"></i>' : esc(s.n)}<span class="sr"> ${esc(STATUS[s.status] || s.status)}</span></div>
      <div><div class="cap">${esc(s.caption)}</div>${s.status === "RUNNING" ? `<div class="live-note">Đang chạy bước này…</div>` : s.status === "TRYING" ? `<div class="live-note">${s.mode === "replay" ? "Đang đưa trang tới bước này…" : "Đang thử trên trang thật…"}</div>` : ""}
        <dl class="kv"><dt>Mong đợi</dt><dd>${esc(s.expected)}${s.checks != null && s.status !== "PENDING" ? ` <span class="tag">${s.checks} kiểm tra</span>` : ""}${s.carried ? ' <span class="tag">giữ từ lần trước</span>' : ""}</dd>
          ${s.evidence ? `<dt>Ảnh cần chụp</dt><dd class="muted">${esc(s.evidence)}</dd>` : ""}
          ${showActual ? `<dt>Thực tế</dt><dd class="act">${esc(s.actual)}</dd>` : ""}</dl></div>${thumb}</div>`;
  }).join("");
  const base = (k.edge_cases.length || k.edge_none || k.data_needs.length || k.questions.length || k.timeout_s) ? `<ul>
      ${k.edge_cases.map(e => `<li>Tình huống biên: ${esc(e)}</li>`).join("")}${k.edge_none ? `<li>Không có tình huống biên: ${esc(k.edge_none)}</li>` : ""}
      ${k.data_needs.map(d => `<li>Dữ liệu có thể thiếu: ${esc(d.what)} → ${esc(d.fallback)}</li>`).join("")}${k.questions.map(q => `<li>Cần hỏi: ${esc(q)}</li>`).join("")}
      ${k.timeout_s ? `<li>Mỗi lần chờ tối đa ${k.timeout_s} giây</li>` : ""}</ul>` : "";
  const notes = k.repairs.length ? `<div class="ai-notes">${k.repairs.map(r => `<div class="note"><h4>AI phân tích lại sau lần ${r.attempt} · ${esc(clock(r.ts))}${r.probed ? ' · đã dò trang thật' : ' · chưa dò trang'}</h4><dl>
      <dt>Nguyên nhân</dt><dd>${esc(r.cause)}</dd><dt>Căn cứ</dt><dd>${esc(r.evidence)}</dd><dt>Đã sửa</dt><dd>${esc(r.change)}</dd>
      ${r.reanalysis ? `<dt>Hiểu lại case</dt><dd>${esc(r.reanalysis)}</dd>` : ""}${r.timeout_s ? `<dt>Thời gian chờ</dt><dd>${r.timeout_s} giây</dd>` : ""}${r.unchanged_reason ? `<dt>Script giữ nguyên</dt><dd>${esc(r.unchanged_reason)}</dd>` : ""}</dl></div>`).join("")}</div>` : "";
  const analysis = (base || notes) ? `<details class="card fold" data-key="analysis-${esc(k.id)}" ${isOpen("analysis-" + k.id, k.repairs.length > 0)}><summary>Phân tích của AI${k.repairs.length ? ` <span class="muted">· đã sửa ${k.repairs.length} lần</span>` : ""}</summary>${base}${notes}</details>` : "";
  const status = `<span class="status ${cls(k.status)}">${stIcon(k.status)}${esc(STATUS[k.status] || k.status)}</span>${k.category ? `<span class="tag">${esc(CATEGORY[k.category] || k.category)}</span>` : ""}${k.reason ? `<span class="muted">${esc(k.reason)}</span>` : ""}${replayTag(k)}${k.replay && k.replay.timing ? `<span class="muted">${esc(timingText(k.replay))}</span>` : ""}${k.replay && k.replay.status === "FAIL" ? `<span class="muted">${esc((k.replay.reason || "").slice(0, 200))}</span>` : ""}`;
  const asks = dispatchBar(k) + reviewBox(k) + hintBox(k);
  box.innerHTML = `<section class="card dhead"><div class="dtitle"><h2>${esc(k.title)}</h2><span class="mono">${esc(k.id)}</span></div>
      <div class="dstatus">${status}</div><div class="dmeta">${meta}</div>${replayBar(k)}</section>
    ${asks ? `<div class="asks">${asks}</div>` : ""}
    <div class="sec"><h3>Các bước</h3><span class="muted">${done}/${steps.length} đạt</span>${tabs}</div>
    <section class="card steps" aria-label="Các bước của testcase">${list || '<p class="muted" style="padding:14px 0;margin:0">Chưa có bước nào.</p>'}</section>
    ${analysis}${historyBox(k)}
    <details class="card fold" data-key="source-${esc(k.id)}" ${isOpen("source-" + k.id, false)}><summary>Testcase gốc <span class="muted">· từ file Excel</span></summary>
      <p><b>Điều kiện:</b> ${esc(k.source.pre) || '<span class="muted">không ghi</span>'}</p><ol>${k.source.steps.map(step => `<li>${esc(step)}</li>`).join("")}</ol><p><b>Mong đợi:</b> ${esc(k.source.expected)}</p></details>`;
}

function reviewBox(k) {
  if (k.review_skipped) return `<p class="muted" style="margin:0"><span class="tag">Đã bỏ qua</span> ${esc(k.review_skipped)}</p>`;
  if (!k.review_pending) return "";
  return `<section class="ask attn-panel"><h3>Need confirm: AI cần bạn xác nhận case này</h3>
    <ul>${k.questions.map(question => `<li>${esc(question)}</li>`).join("")}</ul>
    <textarea id="reviewText" data-draft="review-${esc(k.id)}" aria-label="Câu trả lời hoặc lý do bỏ qua"></textarea>
    <div class="ask-actions"><button id="sendReview" class="btn primary" ${S.busy ? "disabled" : ""}>Gửi trả lời</button>
    <button id="skipReview" class="btn" ${S.busy ? "disabled" : ""}>Bỏ qua testcase</button></div>
    <div class="err">${esc(S.error)}</div></section>`;
}

/** Asking the coordinator for a worker. The request takes no slot and starts nothing: the coordinator re-checks and answers here (accepted with the worker's name, waiting with the reason, or refused). */
function dispatchBar(k) {
  const r = k.request || {}, v = S.view, w = v.workers || { active: 0, limit: 5 };
  const open = ["pending", "waiting"].includes(r.status);
  const label = { dispatch: "Yêu cầu điều phối", reassign: "Yêu cầu giao lại" }[k.can_request];
  const full = w.active >= w.limit;
  const say = r.status === "pending" ? "Đã gửi yêu cầu, đang chờ agent điều phối nhận."
    : r.status === "waiting" ? `Đang chờ: ${esc(r.note)}`
    : r.status === "accepted" ? `Đã giao cho ${esc(r.worker)}.`
    : r.status === "rejected" ? `Yêu cầu bị từ chối: ${esc(r.note)}` : "";
  const failure = r.failure ? `<div class="idle" role="status"><b>Lỗi worker</b> (${esc(clock(r.failure.at))}, chưa phải kết luận của case): ${esc(r.failure.message)}</div>` : "";
  if (!label && !say && !failure) return "";
  return `<section class="ask quiet dispatchbar">${failure}<div class="ask-actions" style="margin-top:${failure ? 8 : 0}px;align-items:center">
    ${label && !open ? `<button class="btn" data-request-case="${esc(k.id)}" ${full || S.busy ? "disabled" : ""} title="${full ? `Đủ ${w.limit}/${w.limit} worker` : "Báo agent điều phối giao case này cho worker rảnh"}">${label}</button>` : ""}
    ${label && !open && full ? `<span class="muted">Hết slot: đang có ${w.active}/${w.limit} worker.</span>` : ""}
    ${say ? `<span class="${r.status === "rejected" ? "err" : "muted"}" id="requestMsg">${say}</span>` : ""}<span class="err" id="requestErr">${esc(S.requestError && S.requestError.case === k.id ? S.requestError.text : "")}</span></div></section>`;
}

/** After the case ended (PASS or FAIL): run its saved script again, same account and Odoo, with the browser in view. */
const videoUrl = (ws, path) => `/api/video?ws=${encodeURIComponent(ws)}&path=${encodeURIComponent(path)}&t=${TOKEN}`;
const CAPTION_LANGUAGES = { vi: "Tiếng Việt", en: "English", ja: "日本語" };
try { S.replayCaptionLanguage = localStorage.getItem("oqaReplayCaptionLanguage"); } catch (_) {}
const captionLanguage = (fallback = S.view?.replay_caption_language) => Object.hasOwn(CAPTION_LANGUAGES, S.replayCaptionLanguage) ? S.replayCaptionLanguage : (fallback || "vi");
const captionSelect = language => `<label>Ngôn ngữ chú thích <select data-caption-language aria-label="Ngôn ngữ chú thích">${Object.entries(CAPTION_LANGUAGES).map(([lang, label]) =>
  `<option value="${lang}" ${lang === language ? "selected" : ""}>${label}</option>`).join("")}</select></label>`;
function replayBar(k) {
  if (!["PASS", "FAIL"].includes(k.status)) return "";
  const note = k.can_replay ? "Mở browser và chạy script đã lưu của case này." : "Chưa có script đã lưu.";
  const videos = k.replay?.videos || (k.replay?.video ? [k.replay.video] : []);
  return `<div class="dtools replaybar">
    <button class="btn sm" data-replay="${esc(k.id)}" ${k.can_replay ? "" : "disabled"} title="${esc(note)}">Chạy lại testcase</button>
    <button class="btn sm primary" data-replay="${esc(k.id)}" data-record="1" ${k.can_replay ? "" : "disabled"} title="${k.can_replay ? "Chạy lại testcase và quay video có chú thích từng bước" : "Chưa có script đã lưu."}">Quay video</button>
    <button class="btn sm" data-regenerate="${esc(k.id)}" ${k.can_replay && !(k.generalized && k.generalized.status === "RUNNING") ? "" : "disabled"} title="AI viết lại script để không phụ thuộc id, dữ liệu hay trạng thái của lần chạy này, rồi tự chạy lại 2 lần để kiểm">Tạo lại script (generic)</button>
    ${k.generalized ? `<span class="muted" style="font-size:12px">Script generic: ${esc(k.generalized.status === "RUNNING" ? "đang viết lại và kiểm tra…" : k.generalized.status === "PASS" ? "đã tạo, replay 2 lần đạt" : k.generalized.status === "STALE" ? "lần viết lại trước bị gián đoạn, có thể tạo lại" : k.generalized.status === "UNVERIFIED" ? "đã viết lại, chưa replay kiểm" : "không đạt, đã giữ script cũ")}</span>` : ""}
    ${videos.map((file, i) => `<a class="btn sm" href="${videoUrl(S.sel.ws, file)}" target="_blank" rel="noopener">Xem video${videos.length > 1 ? ` ${i + 1}` : ""}</a>`).join("")}
    <span class="muted" id="replayMsg" style="font-size:12px">${k.can_replay ? "Kết quả chạy lại hiển thị riêng (Replay), không đổi kết quả Live." : "Chưa có script đã lưu."}</span>
    <details class="opts" data-key="replayopts" ${isOpen("replayopts", false)}><summary>Tuỳ chọn chạy lại</summary><div class="opts-body">
      ${captionSelect(captionLanguage())}
      <label title="Đặt cả hai khoảng nghỉ trình diễn về 0. Thời gian chờ ứng dụng không đổi."><input type="checkbox" data-fast-mode ${S.fast ? "checked" : ""}> Chạy nhanh</label>
      <label>Nghỉ sau thao tác (ms) <input data-replay-delay="action_delay_ms" aria-label="Nghỉ sau thao tác (ms)" type="number" min="0" max="60000" step="100" value="${S.replayTiming.action_delay_ms}" ${S.fast ? "disabled" : ""}></label>
      <label>Nghỉ sau bước (ms) <input data-replay-delay="step_delay_ms" aria-label="Nghỉ sau bước (ms)" type="number" min="0" max="60000" step="100" value="${S.replayTiming.step_delay_ms}" ${S.fast ? "disabled" : ""}></label></div></details></div>`;
}

const CATEGORY = { application: "Lỗi ứng dụng", automation: "Lỗi automation", precondition: "Thiếu điều kiện kiểm thử" };
const timingText = r => { const t = r.timing; return t.total_s == null ? "" : `${r.fast ? "Chạy nhanh · " : ""}${t.total_s}s (nghỉ trình diễn ${t.pause_s}s, ${t.calls} lần gọi trình duyệt ${t.call_s}s)`; };
function historyBox(k) {
  if (!(k.history || []).length) return "";
  return `<details class="card fold" data-key="history-${esc(k.id)}" ${isOpen("history-" + k.id, false)}><summary>Lịch sử kết luận <span class="muted">· ${k.history.length} lần được sửa</span></summary><ul>${k.history.map(h => `<li>${esc(h.at || "")} · ${esc(h.status)}${h.category ? " · " + esc(CATEGORY[h.category] || h.category) : ""} · ${esc(h.reason || "")}${h.superseded_by ? " → " + esc(h.superseded_by) : ""}</li>`).join("")}</ul></details>`;
}
const reportUrl = name => `/api/report?ws=${encodeURIComponent(S.sel.ws)}&id=${encodeURIComponent(S.sel.id)}&name=${encodeURIComponent(name)}&t=${TOKEN}`;

function hintBox(k) {
  if (!k.can_hint) return "";
  const said = k.hints.map(h => `<div class="said">Bạn · ${esc(clock(h.at))}: ${esc(h.text)}</div>`).join("");
  return `<section class="ask hint-box${k.exhausted ? " attn-panel" : ""}"><h3>${k.exhausted ? "Đã hết số lần sửa: AI cần gợi ý của bạn" : "Gợi ý cho AI"}</h3>
    <div class="muted">AI sẽ đọc gợi ý này, rồi chạy lại case này với số lần sửa mới.</div>${said}
    <textarea id="hint" data-draft="hint-${esc(k.id)}" aria-label="Gợi ý cho AI về case ${esc(k.id)}" placeholder="Ví dụ: nút Lưu nằm trong menu Hành động; dùng khách hàng Azure Interior…"></textarea>
    <div class="ask-actions"><button class="btn primary" id="sendHint" ${S.busy ? "disabled" : ""}>Gửi và chạy lại</button></div><div class="err">${esc(S.hintError)}</div></section>`;
}

function restoreDrafts() {
  document.querySelectorAll("textarea").forEach(el => { const key = el.dataset.draft || el.id; if (S.draft[key]) el.value = S.draft[key]; });
}

function openLightbox(i) { S.index = i; $("lb").classList.add("open"); drawLightbox(); }
function drawLightbox() {
  const im = S.gallery[S.index];
  if (!im) return;
  $("lbImg").src = img(S.raw ? im.raw : im.annotated);
  $("lbTitle").textContent = `${S.index + 1}/${S.gallery.length} · ${im.caption}`;
  $("lbRaw").setAttribute("aria-pressed", S.raw);
  $("lbRaw").textContent = S.raw ? "Ảnh khoanh đỏ" : "Ảnh gốc";
}

const mapWorkspace = () => S.ws || (S.sel && S.sel.ws) || (S.workspaces.length === 1 ? S.workspaces[0].name : "");
const mapGet = params => get("/api/sitemap?" + new URLSearchParams({ ws: M.ws, lang: M.lang, ...params })).then(data => {
  if (data.error) throw new Error(data.error);
  return data;
});

const TABS = ["progress", "scripts", "site_map"];
function workspaceTab(tab) {
  S.tab = tab;
  document.body.classList.toggle("site-map-active", tab === "site_map");
  $("main").hidden = tab !== "progress";
  $("siteMapMain").hidden = tab !== "site_map";
  $("scriptsMain").hidden = tab !== "scripts";
  document.querySelectorAll("[data-workspace-tab]").forEach(button => {
    const selected = button.dataset.workspaceTab === tab;
    button.setAttribute("aria-selected", selected); button.tabIndex = selected ? 0 : -1;
  });
  const url = new URL(location.href);
  if (tab === "site_map") url.searchParams.set("tab", "site_map"); else url.searchParams.delete("tab");
  if (tab === "site_map" && mapWorkspace()) url.searchParams.set("workspace", mapWorkspace()); else url.searchParams.delete("workspace");
  history.replaceState(null, "", url);
  if (tab === "site_map") loadMap();
  if (tab === "scripts") loadScripts();
}

const R = { ws: "", data: null, msg: "", busy: false, detail: null };
function scriptsWorkspace() {
  const names = (S.workspaces || []).map(w => w.name);
  return R.ws && names.includes(R.ws) ? R.ws : (S.sel && S.sel.ws) || S.ws || names[0] || "";
}
async function loadScripts() {
  R.ws = scriptsWorkspace();
  if (!R.ws) { $("scriptsMain").innerHTML = '<section class="panel"><p class="muted">Chưa có workspace nào.</p></section>'; return; }
  const ws = R.ws;
  const data = await get("/api/regression?ws=" + encodeURIComponent(ws));
  if (ws !== R.ws) return;
  if (data.error) { R.msg = data.error; return renderScripts(); }
  if (JSON.stringify(R.data) === JSON.stringify(data) && $("scriptsWs")?.value === ws) return;
  R.data = data; renderScripts();
}
function resultCell(r) {
  const status = r.status || "NOT RUN";
  return `<td class="res ${cls(status)}">${status === "CANCELLED" ? "Đã hủy" : esc(status)}${r.at ? `<small>${esc(r.at)}</small>` : ""}${r.video ? `<small><a href="${videoUrl(R.ws, r.video)}" target="_blank" rel="noopener">xem video</a></small>` : ""}${r.reason ? `<small title="${esc(r.reason)}">${esc(String(r.reason).slice(0, 80))}</small>` : ""}</td>`;
}
function scriptStepsHtml(detail, columns) {
  const data = detail.data;
  if (!data) return `<tr class="script-steps"><td colspan="${columns}"><p role="status">Đang tải các bước…</p></td></tr>`;
  if (data.error) return `<tr class="script-steps"><td colspan="${columns}"><p class="err" role="alert">${esc(data.error)}</p></td></tr>`;
  const steps = data.steps.map(step => `<li value="${Number(step.n)}"><strong>${esc(step.action)}</strong>
    ${step.profile ? ` <small class="muted">${esc(step.profile)}</small>` : ""}<div>${esc(step.expected)}</div>
    ${step.shows && step.shows !== step.expected ? `<div class="muted">Kiểm tra hiển thị “${esc(step.shows)}”.</div>` : ""}
    ${step.code.length ? `<details><summary>Mã Playwright</summary><pre><code>${esc(step.code.join("\n"))}</code></pre></details>` : ""}</li>`);
  return `<tr class="script-steps"><td colspan="${columns}">${steps.length ? `<ol>${steps.join("")}</ol>` : '<p>Script chưa có bước nào khớp với kế hoạch.</p>'}
    ${data.problems.length ? `<p class="err">${esc(data.problems.join(" · "))}</p>` : ""}</td></tr>`;
}
async function toggleScriptSteps(button) {
  const detail = { ws: R.ws, session: button.dataset.scriptSteps, case: button.dataset.scriptCase };
  const old = R.detail;
  R.detail = old && old.ws === detail.ws && old.session === detail.session && old.case === detail.case ? null : detail;
  const selector = `[data-script-steps="${CSS.escape(detail.session)}"][data-script-case="${CSS.escape(detail.case)}"]`;
  renderScripts();
  document.querySelector(selector)?.focus();
  if (!R.detail) return;
  const query = new URLSearchParams({ ws: detail.ws, id: detail.session, case: detail.case, view: "steps" });
  detail.data = await get("/api/script?" + query).catch(() => ({ error: "Không tải được các bước của script." }));
  if (R.detail === detail) {
    const focus = document.activeElement?.matches(selector);
    renderScripts();
    if (focus) document.querySelector(selector)?.focus();
  }
}
function renderScripts() {
  const box = $("scriptsMain"), d = R.data;
  if (!d) { box.innerHTML = `<section class="panel"><div class="err">${esc(R.msg)}</div></section>`; return; }
  const wsOptions = (S.workspaces || []).map(w => `<option ${w.name === R.ws ? "selected" : ""}>${esc(w.name)}</option>`).join("");
  const runAll = d.environments.map(e => `<button class="btn" data-regress-env="${esc(e)}" ${R.busy ? "disabled" : ""}>Chạy tất cả trên ${esc(e)}</button><button class="btn primary" data-regress-env="${esc(e)}" data-record="1" ${R.busy ? "disabled" : ""} title="Chạy tất cả script trên ${esc(e)} và quay video có chú thích từng bước">Quay video tất cả trên ${esc(e)}</button>`).join("");
  const rows = d.scripts.map(k => {
    const expanded = R.detail?.ws === R.ws && R.detail?.session === k.session && R.detail?.case === k.case_id;
    return `<tr><td>${k.session ? `<a href="#" data-script-open="${esc(k.session)}" data-script-case="${esc(k.case_id)}">${esc(k.title || k.case_id)}</a>
        <button type="button" class="btn sm" data-script-steps="${esc(k.session)}" data-script-case="${esc(k.case_id)}" aria-label="Các bước script ${esc(k.case_id)}" aria-expanded="${expanded}">Các bước</button>` : esc(k.case)}<small class="muted" style="display:block">${k.case_id ? esc(k.case_id) + " · " : ""}${esc(k.workbook)}</small></td>
    ${d.environments.map(e => resultCell(k.results[e] || {})).join("")}
    <td>${k.case_id ? d.environments.map(e => `<button class="btn sm" data-regress-env="${esc(e)}" data-regress-case="${esc(k.case_id)}" data-regress-session="${esc(k.session)}" ${R.busy ? "disabled" : ""} title="Mở cửa sổ Odoo và hiện chú thích từng bước trên ${esc(e)}">▶ ${esc(e)}</button> <button class="btn sm primary" data-regress-env="${esc(e)}" data-regress-case="${esc(k.case_id)}" data-regress-session="${esc(k.session)}" data-record="1" ${R.busy ? "disabled" : ""} title="Chạy script này trên ${esc(e)} và quay video có chú thích từng bước">Quay video</button>`).join(" ") : '<span class="muted">chưa có phiên để chạy</span>'}</td></tr>
    ${expanded ? scriptStepsHtml(R.detail, d.environments.length + 2) : ""}`;
  }).join("");
  box.innerHTML = `<section class="panel"><header><h2>Script của workspace (${d.scripts.length})</h2><span>Bấm tên case để mở testcase. Kết quả theo từng môi trường; chưa chạy hiện NOT RUN.</span></header>
    <div class="scripts-bar"><select id="scriptsWs" aria-label="Workspace" style="width:auto">${wsOptions}</select>${captionSelect(captionLanguage(d.replay_caption_language || "vi"))}${runAll}<button class="btn" id="scriptsReload">Tải lại</button><span class="muted">${esc(R.msg)}</span></div>
    ${d.scripts.length ? `<div class="case-table-scroll card" style="overflow:auto"><table class="scripts-table"><thead><tr><th>Script / testcase</th>${d.environments.map(e => `<th>${esc(e)}</th>`).join("")}<th>Chạy lại</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">Workspace này chưa có script nào được lưu (chỉ case PASS mới lưu script).</p>'}</section>`;
}

/*__SITE_MAP__*/

function liveHeader(text, on) { $("dot").className = "dot" + (on ? " on" : ""); $("liveText").textContent = text; }
async function refreshList() {
  const [sessions, workspaces] = await Promise.all([get("/api/sessions"), get("/api/workspaces")]);
  const list = sessions.sessions;
  const sig = JSON.stringify([list, workspaces.workspaces]);
  if (sig === S.histSig) return;                       // nothing new: leave the list alone
  S.histSig = sig; S.sessions = list; S.workspaces = workspaces.workspaces || [];
  if (!S.sel && !busyReading()) {
    renderHistory();
    const working = list.filter(s => sessionGroup(s) === "run").length;
    liveHeader(`${list.length} phiên · cập nhật ${new Date().toLocaleTimeString("vi-VN")}`, working > 0);
  }
}
/** True while the person is reading something they selected or typing: the page must not move under them. */
function busyReading() {
  const sel = window.getSelection(), el = document.activeElement;
  return !!(el && el.matches && el.matches("textarea, input[type=text], input[type=search], input[type=number]")) || !!(sel && !sel.isCollapsed && sel.toString().trim() !== "");
}
async function refreshView() {
  if (!S.sel) return;
  const v = await get(`/api/session?ws=${encodeURIComponent(S.sel.ws)}&id=${encodeURIComponent(S.sel.id)}`);
  if (v.error || !S.sel) return;
  const sig = JSON.stringify(v);
  const changed = sig !== S.sig || !S.view;
  S.view = v;
  if (!v.cases.some(c => c.id === S.caseId)) { S.caseId = v.cases.length ? v.cases[0].id : null; S.attempt = null; }       // opening a session lands on its first case
  if (changed && !busyReading()) { S.sig = sig; renderMain(); }        // redraw only when the data changed, and not while they are reading or typing
  liveHeader(v.phase !== "DONE" ? `Trực tiếp · cập nhật ${new Date().toLocaleTimeString("vi-VN")}` : `Đã xong · ${v.updated}`, v.phase !== "DONE");
}
function select(ws, id) {
  S.sel = { ws, id }; S.view = null; S.sig = ""; S.caseId = null; S.attempt = null; S.cq = ""; S.cs = ""; S.drawer = false; S.error = "";
  history.replaceState(null, "", `${location.pathname}${location.search}#${encodeURIComponent(ws)}/${encodeURIComponent(id)}`);
  renderMain(); refreshView(); if (S.tab === "site_map") loadMap();
}
function backToList() {
  S.sel = null; S.view = null; S.sig = ""; S.caseId = null; S.drawer = false;
  history.replaceState(null, "", `${location.pathname}${location.search}`);
  window.scrollTo(0, 0); renderMain(); S.histSig = ""; refreshList();
}

document.addEventListener("click", async e => {
  document.querySelectorAll("details.menu[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
  const del = e.target.closest("[data-del-id]");
  if (del) {
    e.stopPropagation();
    if (!confirm("Xoá phiên test này? Ảnh bằng chứng và dữ liệu của phiên sẽ mất, không khôi phục được.")) return;
    const r = await post("/api/delete_session", { ws: del.dataset.delWs, id: del.dataset.delId });
    if (r.error) { alert(r.error); return; }
    if (S.sel && S.sel.ws === del.dataset.delWs && S.sel.id === del.dataset.delId) backToList();
    S.histSig = ""; await refreshList();
    return;
  }
  const ask = e.target.closest("[data-request-case]");
  if (ask && S.sel) {
    ask.disabled = true;                                           // a double click sends one request; the server keeps one per case anyway
    const r = await post("/api/dispatch-request", { ws: S.sel.ws, id: S.sel.id, case: ask.dataset.requestCase });
    S.requestError = r.error ? { case: ask.dataset.requestCase, text: r.error } : null;
    await refreshView(); renderDetail();
    return;
  }
  const regen = e.target.closest("[data-regenerate]");
  if (regen && S.sel) {
    regen.disabled = true;
    const r = await post("/api/regenerate", { ws: S.sel.ws, id: S.sel.id, case: regen.dataset.regenerate }).catch(() => ({ error: "Không gửi được yêu cầu." }));
    const msg = $("replayMsg");
    if (msg) msg.textContent = r.error || r.message || "Đã bắt đầu.";
    else if (r.error) alert(r.error);
    setTimeout(refreshView, 1500);
    return;
  }
  const rep = e.target.closest("[data-replay], [data-replay-all]");
  if (rep && S.sel) {
    rep.disabled = true;
    const record = rep.dataset.record === "1";
    const r = await post("/api/replay", { ws: S.sel.ws, id: S.sel.id, case: rep.dataset.replayAll ? "all" : rep.dataset.replay,
      ...(record ? RECORD_TIMING : S.replayTiming), fast: record ? false : S.fast, video: record ? "on" : S.videoMode, caption_language: captionLanguage() })
      .catch(() => ({ error: "Không gửi được yêu cầu chạy lại." }));
    const msg = $("replayMsg");
    if (msg) msg.textContent = r.error || r.message || "Đã bắt đầu.";
    else if (r.error) alert(r.error);
    setTimeout(() => { rep.disabled = false; refreshList(); }, 4000);
    return;
  }
  const pickConflict = e.target.closest("[data-conflict-choice]");
  if (pickConflict) {
    S.busy = true; S.error = ""; renderMain();
    const r = await post("/api/conflict", { ws: S.sel && S.sel.ws, id: S.sel && S.sel.id, case: pickConflict.dataset.conflictCase,
      step: +pickConflict.dataset.conflictStep, choice: pickConflict.dataset.conflictChoice });
    S.busy = false; S.error = r.error || "";
    await refreshView(); renderMain();
    return;
  }
  const jump = e.target.closest("[data-case-jump]");
  if (jump && S.sel) {
    S.caseId = jump.dataset.caseJump; S.attempt = null; S.cq = ""; S.cs = ""; renderMain();
    document.querySelector("tr.case[aria-selected=true]")?.scrollIntoView({ block: "nearest" });
    if (window.matchMedia("(max-width: 860px)").matches) document.querySelector(".detail-column")?.scrollIntoView({ block: "start", behavior: "smooth" });
    else document.querySelector(".detail-column")?.scrollTo({ top: 0 });
    return;
  }
  const open = e.target.closest("[data-script-open]");
  if (open) { e.preventDefault(); workspaceTab("progress"); select(R.ws, open.dataset.scriptOpen); S.caseId = open.dataset.scriptCase; S.attempt = null; return; }
  const scriptSteps = e.target.closest("[data-script-steps]");
  if (scriptSteps) return toggleScriptSteps(scriptSteps);
  const t = e.target.closest("button, tr.case, [data-map-screen], [data-map-expand], [data-map-home], [data-map-focus]");
  if (!t) return;
  if (t.dataset.workspaceTab) return t.dataset.workspaceTab === "progress" && S.tab === "progress" && S.sel ? backToList() : workspaceTab(t.dataset.workspaceTab);       // the first tab is the session list: pressing it inside a session goes back to the list
  if (t.id === "openActivity") { S.drawer = !S.drawer; return renderMain(); }
  if (t.id === "closeActivity") { S.drawer = false; return renderMain(); }
  if (t.id === "caseToggle") return toggleCases();
  if (t.dataset.sfilter) { S.sfilter = t.dataset.sfilter; return renderMain(); }
  if (t.dataset.stat) { S.cs = S.cs === t.dataset.stat ? "" : t.dataset.stat; if (S.casesCollapsed) toggleCases(false); return renderMain(); }
  if (t.id === "scriptsReload") return loadScripts();
  if (t.dataset.regressEnv) {
    R.busy = true; renderScripts();
    const id = t.dataset.regressSession;
    const body = { ws: R.ws, env: t.dataset.regressEnv, video: t.dataset.record === "1" ? "on" : S.videoMode,
      caption_language: captionLanguage(R.data?.replay_caption_language || "vi") };
    const r = await post(id ? "/api/replay" : "/api/regress", id ? { ...body, id, case: t.dataset.regressCase, ...RECORD_TIMING } : body)
      .catch(() => ({ error: "Không gửi được yêu cầu chạy lại." }));
    R.msg = r.error || r.message || "Đã bắt đầu."; renderScripts();
    setTimeout(() => { R.busy = false; loadScripts(); }, 4000);
    return;
  }
  if (t.id === "mapReload") return loadMap();
  if (t.dataset.mapHome) return resetGraph();
  if (t.dataset.mapFocus) { G.focus = t.dataset.mapFocus; G.expanded.add(G.focus); G.inspector = false; G.fit = true; return renderMap(); }
  if (t.dataset.mapExpand) {
    e.preventDefault();
    const key = t.dataset.mapExpand;
    if (!G.focus) { G.focus = key; G.expanded.add(key); }
    else if (G.expanded.has(key)) G.expanded.delete(key); else G.expanded.add(key);
    G.fit = true; G.searchOpen = false; return renderMap();
  }
  if (t.id === "mapZoomIn") return graphZoom(1.25);
  if (t.id === "mapZoomOut") return graphZoom(1/1.25);
  if (t.id === "mapFit") return graphFit();
  if (t.id === "mapCollapse") { G.expanded.clear(); G.expanded.add(G.focus); G.fit = true; return renderMap(); }
  if (t.id === "mapCloseInspector") { G.inspector = false; G.fit = true; return renderMap(); }
  if (t.id === "mapCloseSearch") { G.searchOpen = false; return renderMap(); }
  if (t.dataset.mapScreen) {
    e.preventDefault();
    return selectGraphScreen(t.dataset.mapScreen);
  }
  if (t.dataset.mapMode) { M.mode = t.dataset.mapMode; return renderMap(); }
  if (t.classList.contains("srow")) return select(t.dataset.ws, t.dataset.id);
  if (t.matches("tr.case")) {
    S.caseId = t.dataset.id; S.attempt = null; renderMain();
    if (window.matchMedia("(max-width: 860px)").matches) document.querySelector(".detail-column")?.scrollIntoView({ block: "start", behavior: "smooth" });
    else document.querySelector(".detail-column")?.scrollTo({ top: 0 });
    return;
  }
  if (t.dataset.attempt) { S.attempt = +t.dataset.attempt; return renderDetail(); }
  if (t.dataset.g !== undefined) return openLightbox(+t.dataset.g);
  if (t.id === "lbClose") return $("lb").classList.remove("open");
  if (t.id === "lbPrev") { S.index = (S.index + S.gallery.length - 1) % S.gallery.length; return drawLightbox(); }
  if (t.id === "lbNext") { S.index = (S.index + 1) % S.gallery.length; return drawLightbox(); }
  if (t.id === "lbRaw") { S.raw = !S.raw; return drawLightbox(); }
  const where = { ws: S.sel && S.sel.ws, id: S.sel && S.sel.id };
  const call = {
    exportReport: () => post("/api/report", where),
    confirm: () => post("/api/confirm", where), stop: () => post("/api/stop", where), resume: () => post("/api/resume", where),
    sendAnswer: () => post("/api/answer", { ...where, text: ($("answer") || {}).value || "" }),
    sendReview: () => post("/api/review", { ...where, case: S.caseId, text: ($("reviewText") || {}).value || "" }),
    skipReview: () => post("/api/review", { ...where, case: S.caseId, text: ($("reviewText") || {}).value || "", skip: true }),
    addRef: () => post("/api/refs", { ...where, path: ($("refPath") || {}).value || "" }),
    sendHint: () => post("/api/hint", { ...where, case: S.caseId, text: ($("hint") || {}).value || "" }),
  }[t.id];
  if (call) {
    S.busy = true; S.error = ""; S.hintError = ""; renderMain();
    const r = await call();
    S.busy = false;
    if (t.id === "sendHint") { S.hintError = r.error || ""; if (!r.error) delete S.draft["hint-" + S.caseId]; } else S.error = r.error || "";
    if (t.id === "sendAnswer" && !r.error) delete S.draft.answer;
    if (["sendReview", "skipReview"].includes(t.id) && !r.error) delete S.draft["review-" + S.caseId];
    if (t.id === "addRef" && r.ok) delete S.draft.refPath;
    await refreshView();
    renderMain();
    if (t.id === "exportReport" && !r.error) window.location.assign(reportUrl(r.main));        // hand the workbook over as soon as it is built
  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.key) S.open[d.dataset.key] = d.open; }, true);
document.addEventListener("input", e => {
  if (e.target.tagName === "TEXTAREA") S.draft[e.target.dataset.draft || e.target.id] = e.target.value;
  if (e.target.id === "mapQuery") M.q = e.target.value;
  if (e.target.id === "mapMatch") M.match = e.target.value;
  if (e.target.id === "sessQ") { S.sq = e.target.value; drawSessionList(); }
  if (e.target.id === "caseQ") { S.cq = e.target.value; drawCaseRows(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "mapSearchForm") { e.preventDefault(); G.searchOpen = true; return loadMap(); }
  if (e.target.id === "mapDetailForm") { e.preventDefault(); return loadMapScreen(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.captionLanguage !== undefined) {
    S.replayCaptionLanguage = e.target.value;
    try { localStorage.setItem("oqaReplayCaptionLanguage", S.replayCaptionLanguage); } catch (_) {}
    return;
  }
  if (e.target.dataset.fastMode !== undefined) {
    if (e.target.checked) { S.fastPrev = { ...S.replayTiming }; S.replayTiming.action_delay_ms = 0; S.replayTiming.step_delay_ms = 0; }
    else S.replayTiming = { ...S.fastPrev };
    S.fast = e.target.checked;
    saveFast();
    try { localStorage.setItem("oqaReplayTiming", JSON.stringify(S.replayTiming)); } catch (err) {}
    if (S.view) renderDetail();
    return;
  }
  if (e.target.dataset.replayDelay) {
    if (!e.target.checkValidity() || !Number.isInteger(Number(e.target.value)) || e.target.value === "") {
      e.target.value = S.replayTiming[e.target.dataset.replayDelay]; return;
    }
    S.replayTiming[e.target.dataset.replayDelay] = Number(e.target.value);
    try { localStorage.setItem("oqaReplayTiming", JSON.stringify(S.replayTiming)); } catch (err) {}
    return;
  }
  if (e.target.id === "wsFilter") { S.ws = e.target.value; renderHistory(); if (S.tab === "site_map") workspaceTab("site_map"); return; }
  if (e.target.id === "caseStatus") { S.cs = e.target.value; drawCaseRows(); return; }
  if (e.target.id === "mapWorkspace") { S.ws = e.target.value; renderHistory(); return workspaceTab("site_map"); }
  if (e.target.id === "scriptsWs") { R.ws = e.target.value; return loadScripts(); }
  if (e.target.id === "mapLanguage") { M.lang = e.target.value; return loadMap(); }
  if (e.target.id === "mapKind") { M.kind = e.target.value; G.searchOpen = !!(M.kind || M.q); return loadMap(); }
  if (e.target.id === "mapView") { M.view = e.target.value; return loadMapScreen(); }
  if (e.target.id === "mapRequired") { M.required = e.target.checked; return loadMapScreen(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("[data-map-screen], [data-map-expand], [data-map-home], [data-map-focus]") && ["Enter", " "].includes(e.key)) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles:true })); return; }
  if (e.target.id === "mapDiagram") {
    if (["+", "="].includes(e.key)) { e.preventDefault(); return graphZoom(1.25); }
    if (e.key === "-") { e.preventDefault(); return graphZoom(1/1.25); }
    if (e.key === "Home") { e.preventDefault(); return graphFit(); }
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) { e.preventDefault(); G.x += e.key === "ArrowLeft" ? 45 : e.key === "ArrowRight" ? -45 : 0; G.y += e.key === "ArrowUp" ? 45 : e.key === "ArrowDown" ? -45 : 0; return graphTransform(); }
  }
  if (e.key === "Escape" && S.tab === "site_map") { G.inspector = false; G.searchOpen = false; return renderMap(); }
  if (e.key === "Escape" && S.drawer && !$("lb").classList.contains("open")) { S.drawer = false; return renderMain(); }
  if (e.target.dataset.workspaceTab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const at = TABS.indexOf(e.target.dataset.workspaceTab);
    const tab = e.key === "Home" ? TABS[0] : e.key === "End" ? TABS[TABS.length - 1] : TABS[(at + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
    workspaceTab(tab); $("tab-" + tab.replace("_", "-")).focus(); return;
  }
  if (e.key === "Enter" && e.target.matches("tr.case")) return e.target.click();
  if (e.target.matches("tr.case") && ["ArrowDown", "ArrowUp"].includes(e.key)) {
    e.preventDefault();
    const rows = [...document.querySelectorAll("tr.case")], at = rows.indexOf(e.target);
    const next = rows[at + (e.key === "ArrowDown" ? 1 : -1)];
    if (next) { next.focus(); next.click(); document.querySelector(`tr.case[data-id="${CSS.escape(next.dataset.id)}"]`)?.focus(); }
    return;
  }
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") $("lb").classList.remove("open");
  else if (e.key === "ArrowLeft") $("lbPrev").click();
  else if (e.key === "ArrowRight") $("lbNext").click();
  else if (e.key.toLowerCase() === "r") $("lbRaw").click();
});

(async function start() {
  await refreshList();
  const params = new URLSearchParams(location.search);
  if (S.workspaces.some(w => w.name === params.get("workspace"))) S.ws = params.get("workspace");
  const hash = location.hash.slice(1).split("/").map(decodeURIComponent);
  const first = (hash.length === 2 && S.sessions.find(s => s.workspace === hash[0] && s.session === hash[1])) || (BOOT.select && S.sessions.find(s => s.workspace === BOOT.select[0] && s.session === BOOT.select[1]));
  if (first) select(first.workspace, first.session); else { renderMain(); liveHeader(S.sessions.length ? `${S.sessions.length} phiên` : "chưa có phiên test", false); }
  if (params.get("tab") === "site_map") workspaceTab("site_map");
  setInterval(() => { if (!$("lb").classList.contains("open")) refreshView(); }, 1500);
  setInterval(refreshList, 4000);
  setInterval(() => { if (S.tab === "scripts" && !R.busy) loadScripts(); }, 5000);
})();
