<style>
  /* Warm editorial look: a cream canvas, coral used sparingly, a serif for headings, dark surfaces for code. No external fonts: the stacks fall back to what the computer has. */

  :root {

    --ink:#faf9f5; --body:#d8d5cd; --muted:#a09d96; --accent:#cc785c; --accent-active:#a9583e; --accent-ink:#ffffff; --ring:rgba(204,120,92,.28);
    --dark:#12110f; --dark-soft:#12110f; --dark-elev:#252320; --on-dark:#faf9f5; --on-dark-soft:#a09d96;
    --pass:#5db872; --fail:#e26f6f; --pending:#d4a017; --blocked:#a09d96; --running:#5db8a6; --repairing:#e8a55a; --planned:#8e8b82; } }
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--scrollbar-thumb) var(--scrollbar-track); }

  .layout { display:grid; flex:1; min-height:0; grid-template-columns:248px minmax(0,1fr); grid-template-rows:auto; align-items:start; }

  /* One screen, three columns: sessions | cases | detail. Only the columns scroll; the header stays put. */

    btn.title = on ? "Mở danh sách testcase" : "Thu gọn danh sách testcase";
  }
  try { localStorage.setItem("oqaCasesCollapsed", on ? "1" : "0"); } catch (e) {}
}
toggleCases(S.casesCollapsed);
try { if (localStorage.getItem("oqaRailCollapsed") === "1") window.addEventListener("DOMContentLoaded", () => toggleRail(true)); } catch (e) {}

function drawHistory() {

  $("wsFilter").innerHTML = '<option value="">Tất cả workspace</option>' + names.map(n => `<option ${n === S.ws ? "selected" : ""}>${esc(n)}</option>`).join("");
  const list = S.sessions.filter(s => !S.ws || s.workspace === S.ws);
  $("history").innerHTML = list.map(s => {
    const cur = S.sel && S.sel.ws === s.workspace && S.sel.id === s.session;
    const file = s.file.split(/[\\/]/).pop();
    return `<div class="histrow"><button class="del" data-del-ws="${esc(s.workspace)}" data-del-id="${esc(s.session)}" title="Xoá phiên này" aria-label="Xoá phiên này">✕</button><button class="hist" data-ws="${esc(s.workspace)}" data-id="${esc(s.session)}" aria-current="${cur}">
      <div class="name" title="${esc(file)}">${esc(file)}</div>
      <div class="sub"><span>${esc(s.workspace)} · ${esc(day(s.created))} ${esc(clock(s.created))}</span><span>${s.waiting ? '<span class="tag attn">chờ bạn</span>' : s.idle ? `<span class="tag" title="Không có hoạt động ${s.idle_hours} giờ">bỏ dở? · ${esc(PHASE[s.phase])}</span>` : `<span class="tag">${esc(PHASE[s.phase])}</span>`}</span></div>
      ${bar(s.counts, s.total)}</button></div>`;
  }).join("") || '<p class="muted" style="padding:14px">Chưa có phiên test nào.</p>';
}

function ticks(c) {
  const ex = c.explore || { verified: [], trying: null };
  const last = c.attempts.length ? c.attempts[c.attempts.length - 1].steps
    : c.planned.map(p => ({ status: ex.trying && ex.trying.step === p.n ? "TRYING" : ex.verified.includes(p.n) ? "PASS" : "PENDING" }));
  const done = last.filter(s => s.status === "PASS").length;
  return `<span class="ticks">${last.map(s => `<i class="${s.status === "PASS" ? "p" : s.status === "FAIL" ? "f" : s.status === "TRYING" ? "t" : ""}"></i>`).join("")}</span><span class="muted">${done}/${last.length}</span>`;
}

function renderMain() { keepScroll(drawMain); }

function refsPanel(v) {
  if (v.phase === "DONE") return "";
  const list = (v.refs || []).map(r => `<li><span class="mono">${esc(r.name)}</span> <span class="muted">${r.kind === "folder" ? "thư mục" : "tệp"} · ${esc(r.path)}${r.case ? " · case " + esc(r.case) : ""}</span></li>`).join("");
  return `<section class="refs-panel"><h3>Tệp tham chiếu</h3><div class="muted">Thiết kế (BD), đặc tả, file import, thư mục đính kèm… Dán đường dẫn trên máy này (mỗi dòng một đường dẫn), AI tự đọc, không cần tải lên.</div>
      <textarea id="refPath" aria-label="Đường dẫn tệp hoặc thư mục" placeholder="C:\\Users\\bạn\\Documents\\BD_man_hinh_don_hang.xlsx"></textarea>
      <button class="btn" id="addRef" title="Thêm đường dẫn" ${S.busy ? "disabled" : ""}>Thêm đường dẫn</button>${list ? `<ul>${list}</ul>` : ""}</section>`;
}

function liveBoard(v) {
  const active = v.cases.filter(k => k.status === "EXPLORING" || k.status === "RUNNING" || k.status === "REPAIRING" || (k.explore && k.explore.trying));
  const free = (v.free_cases || []).filter(id => !active.some(k => k.id === id));
  const freeLine = free.length ? `<div class="lb-free">Chưa có agent nhận: ${free.map(id => `<b class="mono">case ${esc(id)}</b>`).join(", ")}</div>` : "";
  const notes = (v.notes || []).length ? `<details data-key="notes" ${isOpen("notes", false)}><summary>Ghi chú chung (${v.notes.length})</summary><ul class="activity">${v.notes.map(n => `<li><span class="mono">${esc(String(n.ts).slice(11, 19))}</span> <b>${esc(n.agent)}</b>${n.case ? " · case " + esc(n.case) : ""}: ${esc(n.text)}</li>`).join("")}</ul></details>` : "";
  if (!active.length) return freeLine || notes ? `<div class="live-mini">${freeLine}${notes}</div>` : "";
  const rows = active.map(k => {
    const total = k.planned.length || 1, ex = k.explore || { verified: [], trying: null };
    const run = k.attempts.length ? k.attempts[k.attempts.length - 1] : null;
    const done = run ? run.steps.filter(s => s.status === "PASS").length : ex.verified.length;
    return `<button type="button" class="live-chip" data-case-jump="${esc(k.id)}" title="${esc(k.title || "")}${k.owner ? " · " + esc(k.owner) : ""}">case ${esc(k.id)} · ${done}/${total} bước</button>`;
  }).join("");
  return `<div class="live-mini"><b>Đang chạy ${active.length}:</b>${rows}${freeLine}${notes}</div>`;
}

function activityPanel(v) {
  const rows = (v.activity || []).map(a => {
    const when = String(a.ts || "").slice(11, 19);
    const what = a.kind === "try_started" ? (a.mode === "replay" ? "chạy lại các bước đã xác nhận" : `bắt đầu thử bước ${a.step}`)
      : a.kind === "explore" ? (a.ok ? `bước ${a.step} đã thử xong, đạt` : `bước ${a.step} thử chưa đạt: ${a.error}`)
      : a.kind === "built" ? "đã dựng script"
      : a.kind === "case_started" ? "bắt đầu chạy case"
      : a.kind === "attempt_finished" ? `lần chạy kết thúc: ${a.status}${a.error ? " (" + a.error + ")" : ""}`
      : a.kind === "repair" ? `ghi nhận sửa: ${a.cause}` : a.kind;
    const code = a.kind === "explore" && a.code ? `<div class="muted mono act-code">${esc(a.code.replace(/\s+/g, " "))}</div>` : "";
    return `<li><span class="mono">${esc(when)}</span> <b class="mono">case ${esc(a.case)}</b> ${esc(what)}${code}</li>`;
  }).join("");
  if (!rows) return "";
  return `<details data-key="activity" ${isOpen("activity", true)}><summary>Hoạt động trực tiếp (mọi agent, mọi case)</summary><ul class="activity">${rows}</ul></details>`;
}

  const active = v.cases.filter(k => LIVE.includes(k.status)).length;

  let attention = "";

  else if (v.waiting?.review) attention = `<section class="head-attention attn-panel"><h3>Rà soát testcase</h3><span class="muted">Mở các case Need confirm ở cột giữa để trả lời hoặc bỏ qua.</span></section>`;

      <textarea id="answer" aria-label="Câu trả lời" placeholder="Dán thẳng đường dẫn tệp vào đây nếu cần thiết kế, file import… AI tự đọc."></textarea><div class="head-actions"><button class="btn primary" id="sendAnswer" ${S.busy ? "disabled" : ""}>Gửi trả lời</button></div><div class="err">${esc(S.error)}</div></section>`;

      <details data-key="strategy" ${isOpen("strategy", false)}><summary>Chiến lược</summary><pre class="strategy">${esc(v.strategy)}</pre></details><div class="head-actions"><button class="btn primary" id="confirm" ${S.busy ? "disabled" : ""}>Xác nhận và bắt đầu test</button></div><div class="err">${esc(S.error)}</div></section>`;
  const rows = v.cases.map(k => `<tr class="case ${cls(k.status)}" tabindex="0" data-id="${esc(k.id)}" aria-selected="${k.id === S.caseId}">
      <td class="mono case-id">${esc(k.id)}</td><td><div class="title">${esc(k.title)}</div></td><td>${esc(k.profile) || '<span class="muted">-</span>'}</td><td>${ticks(k)}</td>
      <td>${k.attempts.length || '<span class="muted">-</span>'}</td><td><span class="status">${dot(k.status)}${esc(STATUS[k.status] || k.status)}</span>
      ${k.review_pending ? '<span class="tag attn">Need confirm</span>' : k.review_skipped ? '<span class="tag">Đã bỏ qua</span>' : k.verdict === "ready" && v.phase === "ANALYZE" ? '<span class="tag">Ready</span>' : ""}</td><td>${replayTag(k) || '<span class="muted">-</span>'}</td></tr>`).join("");
  const replay = ["PASS", "FAIL", "NOT RUN"].filter(k => (v.replay_counts || {})[k]).map(k => `<span class="s-${k === "NOT RUN" ? "NEW" : k}"><strong>${v.replay_counts[k]}</strong><i class="sq"></i>${esc(RSTATUS[k])}</span>`).join("") || '<span class="muted">Chưa có case đủ điều kiện chạy lại.</span>';
  $("main").innerHTML = `
    <header class="session-head">
      <div class="session-title-row"><h1>${esc(v.file.split(/[\\/]/).pop())}</h1><span class="tag">${v.stopped ? "Đã dừng" : esc(PHASE[v.phase])}</span>${v.phase === "EXECUTE" && v.can_stop ? `<button class="btn danger" id="stop" ${S.busy ? "disabled" : ""}>Dừng test</button>` : ""}</div>
      <div class="session-meta"><span>Workspace <b>${esc(v.workspace)}</b></span><span class="mono">${esc(v.session)}</span><span>Bắt đầu ${esc(v.created)}</span>${(v.connect && v.connect.version) ? `<span>Odoo ${esc(v.connect.version)}</span>` : ""}<span>${v.knowledge} mục tri thức</span><span>${esc(v.now)}</span></div>
      <div class="strip">
        <div class="progress-summary"><strong>${settled}</strong><span class="muted">/${total} có trạng thái</span></div>
        ${bar(c, total)}
        <span class="agent-pill">${active} đang chạy${v.workers ? ` · ${v.workers.active}/${v.workers.limit} slot` : ""}</span>
        <div class="phase-mini">${phases}</div>
      </div>
      <div class="mini-stats"><span><strong>${passed}</strong>/${total} Live đạt</span>${stats}</div>
      <div class="replay-line" aria-label="Kết quả chạy lại script"><span>Replay</span>${replay}
        ${v.cases.some(k => k.can_replay) && ["REPORT", "DONE"].includes(v.phase) ? `<button class="btn" data-replay-all="1" title="Chạy lại script của tất cả case đã lưu script">Chạy lại tất cả</button><button class="btn primary" data-replay-all="1" data-record="1" title="Chạy lại tất cả case đã lưu script và quay video có chú thích từng bước">Quay video tất cả</button>` : ""}</div>
      ${v.idle && !v.waiting ? `<div class="idle">Không có hoạt động ${Math.floor(v.idle_hours)} giờ nay. Bảo AI chạy <span class="mono">oqa status</span> để tiếp tục.</div>` : ""}
      ${attention}
      ${v.phase === "EXECUTE" ? liveBoard(v) : ""}

        <section class="panel case-list" aria-labelledby="caseListTitle"><header><h2 id="caseListTitle">Testcase <span>${total}</span></h2><button type="button" id="caseToggle" class="case-toggle" aria-controls="caseListBody" aria-expanded="${!S.casesCollapsed}" aria-label="${S.casesCollapsed ? "Mở danh sách testcase" : "Thu gọn danh sách testcase"}" title="${S.casesCollapsed ? "Mở danh sách testcase" : "Thu gọn danh sách testcase"}">${S.casesCollapsed ? "»" : "«"}</button><span class="case-hint">Mã · trạng thái · tiến độ từng bước</span></header>
          <div class="case-table-scroll" id="caseListBody" role="region" aria-label="Danh sách testcase trong phiên" tabindex="0"><table class="case-table"><colgroup><col><col><col><col><col><col><col></colgroup><thead><tr><th scope="col">Case</th><th scope="col">Nội dung</th><th scope="col">Profile</th><th scope="col">Bước</th><th scope="col">Lần</th><th scope="col">Live</th><th scope="col">Replay</th></tr></thead><tbody>${rows}</tbody></table></div>
        </section>
        <div class="case-foot">

        </div>

      <section class="detail-column"><div class="panel detail" id="detail"></div></section>
    </div>`;
  renderDetail();

function renderDetail() {
  const box = $("detail");
  if (!box) return;
  const top = box.scrollTop;
  drawDetail(box);
  box.scrollTop = top;
}

function drawDetail(box) {
  const v = S.view, k = v && v.cases.find(x => x.id === S.caseId);
  if (!k) { box.innerHTML = '<p class="muted">Chọn một case để xem từng bước và ảnh bằng chứng.</p>'; return; }
  const att = k.attempts.find(a => a.n === S.attempt) || k.attempts[k.attempts.length - 1];
  const ex = k.explore || { verified: [], trying: null };
  const steps = att ? att.steps : k.planned.map(p => ({ ...p, images: [], actual: "",
    status: ex.trying && ex.trying.step === p.n ? "TRYING" : ex.verified.includes(p.n) ? "VERIFIED" : "PENDING", mode: ex.trying && ex.trying.step === p.n ? ex.trying.mode : "" }));
  S.gallery = steps.flatMap(s => s.images.map(im => ({ ...im, caption: im.caption || `Bước ${s.n}: ${s.caption}` })));
  const chips = [k.profile && `Profile ${k.profile}`, k.depends_on.length && `Tiếp từ ${k.depends_on.join(", ")}`, k.clarity && `Rõ ràng ${k.clarity}/5`, k.sufficiency && `Đủ dữ kiện ${k.sufficiency}/5`, `dòng ${k.row}`].filter(Boolean)
    .map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const tabs = k.attempts.length > 1 ? `<div class="tabs" role="tablist">${k.attempts.map(a => `<button role="tab" data-attempt="${a.n}" aria-selected="${att && a.n === att.n}"><i class="sq ${cls(a.status)}"></i>Lần ${a.n} · ${esc(STATUS[a.status] || a.status)}${a.from_step > 1 ? ` · từ bước ${a.from_step}` : ""}</button>`).join("")}</div>` : "";
  let g = -1;
  const list = steps.map(s => {
    const first = s.images[0];
    const thumb = first ? `<button class="thumb ${s.status === "FAIL" ? "fail" : ""}" data-g="${(g += s.images.length) - s.images.length + 1}" style="background-image:url('${img(first.annotated)}')" aria-label="Phóng to ảnh bước ${s.n}"><span>${s.images.length > 1 ? s.images.length + " ảnh" : "xem"}</span></button>` : `<div class="noimg">${{ PENDING: att ? "chưa chạy" : "chờ xác thực", RUNNING: "đang chạy…", TRYING: "đang thử…", VERIFIED: "đã thử trên trang thật" }[s.status] || "không có ảnh"}</div>`;
    return `<div class="step ${cls(s.status)}"><div class="n">${LIVE.includes(s.status) ? dot(s.status) : s.n}</div><div><div class="cap">${esc(s.caption)}</div>${s.status === "RUNNING" ? `<div class="live-note">Đang chạy bước này…</div>` : s.status === "TRYING" ? `<div class="live-note">${s.mode === "replay" ? "Đang đưa trang tới bước này…" : "Đang thử trên trang thật…"}</div>` : ""}<div class="exp">Mong đợi: ${esc(s.expected)}${s.checks != null && s.status !== "PENDING" ? ` <span class="tag">${s.checks} kiểm tra</span>` : ""}${s.carried ? ' <span class="tag">giữ từ lần trước</span>' : ""}</div>
      ${s.evidence ? `<div class="exp">Ảnh cần chụp: ${esc(s.evidence)}</div>` : ""}
      ${s.actual && s.status !== "PENDING" ? `<div class="act">${s.status === "PASS" ? "Thực tế: " : ""}${esc(s.actual)}</div>` : ""}</div>${thumb}</div>`;
  }).join("");
  const base = (k.edge_cases.length || k.edge_none || k.data_needs.length || k.questions.length || k.timeout_s) ? `<ul>
      ${k.edge_cases.map(e => `<li>Tình huống biên: ${esc(e)}</li>`).join("")}${k.edge_none ? `<li>Không có tình huống biên: ${esc(k.edge_none)}</li>` : ""}
      ${k.data_needs.map(d => `<li>Dữ liệu có thể thiếu: ${esc(d.what)} → ${esc(d.fallback)}</li>`).join("")}${k.questions.map(q => `<li>Cần hỏi: ${esc(q)}</li>`).join("")}
      ${k.timeout_s ? `<li>Mỗi lần chờ tối đa ${k.timeout_s} giây</li>` : ""}</ul>` : "";
  const notes = k.repairs.length ? `<div class="ai-notes">${k.repairs.map((r, i) => `<div class="note"><h4>AI phân tích lại sau lần ${r.attempt} · ${esc(clock(r.ts))}${r.probed ? ' · đã dò trang thật' : ' · chưa dò trang'}</h4><dl>
      <dt>Nguyên nhân</dt><dd>${esc(r.cause)}</dd><dt>Căn cứ</dt><dd>${esc(r.evidence)}</dd><dt>Đã sửa</dt><dd>${esc(r.change)}</dd>
      ${r.reanalysis ? `<dt>Hiểu lại case</dt><dd>${esc(r.reanalysis)}</dd>` : ""}${r.timeout_s ? `<dt>Thời gian chờ</dt><dd>${r.timeout_s} giây</dd>` : ""}${r.unchanged_reason ? `<dt>Script giữ nguyên</dt><dd>${esc(r.unchanged_reason)}</dd>` : ""}</dl></div>`).join("")}</div>` : "";
  const analysis = (base || notes) ? `<details data-key="analysis-${esc(k.id)}" ${isOpen("analysis-" + k.id, k.repairs.length > 0)}><summary>Phân tích của AI${k.repairs.length ? ` · đã sửa ${k.repairs.length} lần` : ""}</summary>${base}${notes}</details>` : "";
  box.innerHTML = `<h2><span class="mono">${esc(k.id)}</span> ${esc(k.title)}</h2>
    <div><span class="muted">Live</span> <span class="status ${cls(k.status)}">${dot(k.status)}${esc(STATUS[k.status] || k.status)}</span>${k.category ? ` <span class="tag">${esc(CATEGORY[k.category] || k.category)}</span>` : ""}${k.reason ? ` <span class="muted">· ${esc(k.reason)}</span>` : ""}${replayTag(k) ? ` &nbsp; ${replayTag(k)}` : ""}${k.replay && k.replay.timing ? ` <span class="muted">· ${esc(timingText(k.replay))}</span>` : ""}${k.replay && k.replay.status === "FAIL" ? ` <span class="muted">· ${esc((k.replay.reason || "").slice(0, 200))}</span>` : ""}</div>${historyBox(k)}
    ${dispatchBar(k)}${replayBar(k)}<div class="chips">${chips}</div>${reviewBox(k)}
    <section aria-label="Testcase gốc">
      <h3>Testcase gốc</h3>
      <p>${esc(k.source.pre)}</p>
      <ol>${k.source.steps.map(step => `<li>${esc(step)}</li>`).join("")}</ol>
      <p>Mong đợi: ${esc(k.source.expected)}</p>
    </section>
    ${hintBox(k)}${tabs}${list ? "<h3>Các bước sau đánh giá</h3>" : ""}${list}${analysis}`;
}

function reviewBox(k) {
  if (k.review_skipped) return `<p><span class="tag">Đã bỏ qua</span> ${esc(k.review_skipped)}</p>`;
  if (!k.review_pending) return k.verdict === "ready" ? '<span class="tag">Ready</span>' : "";
  return `<section class="attn-panel"><h3>Need confirm</h3>
    <ul>${k.questions.map(question => `<li>${esc(question)}</li>`).join("")}</ul>
    <textarea id="reviewText" data-draft="review-${esc(k.id)}" aria-label="Câu trả lời hoặc lý do bỏ qua"></textarea>
    <button id="sendReview" class="btn primary" ${S.busy ? "disabled" : ""}>Gửi trả lời</button>
    <button id="skipReview" class="btn" ${S.busy ? "disabled" : ""}>Bỏ qua testcase</button>
    <div class="err">${esc(S.error)}</div></section>`;
}

/** Asking the coordinator for a worker. The request takes no slot and starts nothing: the coordinator re-checks and answers here (accepted with the worker's name, waiting with the reason, or refused). */
function dispatchBar(k) {
  const r = k.request || {}, v = S.view, w = v.workers || { active: 0, limit: 5 };
  const open = ["pending", "waiting"].includes(r.status);

/* Workspace graph viewer. SVG coordinates stay separate from pan/zoom and inspector state. */
const G = { focus: "", expanded: new Set(), route: [], inspector: false, searchOpen: false, x: 0, y: 0, zoom: 1, fit: true, layout: null, drag: null };
const graphNodeWidth = 280, graphNodeHeight = 96;

function graphIndex() {
  const graph = M.data && M.data.graph || { nodes: [], edges: [] };
  const nodes = new Map(graph.nodes.map(node => [node.key, node])), outgoing = new Map(), incoming = new Map();
  const orphans = [];
  graph.edges.forEach(edge => {
    if (edge.kind === "menu" && nodes.has(edge.to) && !nodes.has(edge.from)) orphans.push(edge.to);
    if (!nodes.has(edge.from) || !nodes.has(edge.to)) return;
    if (!outgoing.has(edge.from)) outgoing.set(edge.from, []);
    if (!incoming.has(edge.to)) incoming.set(edge.to, []);
    outgoing.get(edge.from).push(edge); incoming.get(edge.to).push(edge);
  });
  const edges = [...graph.edges];
  if (orphans.length) {
    const key = "other-menus";
    nodes.set(key, { key, kind: "group", label: M.lang === "ja" ? "その他のメニュー" : "Other menus", model: M.lang === "ja" ? `${orphans.length} メニュー · 親メニュー未取得` : `${orphans.length} menus · parent unavailable` });
    outgoing.set(key, orphans.map(to => ({ from: key, to, kind: "menu" })));
    outgoing.get(key).forEach(edge => { incoming.set(edge.to, [edge]); edges.push(edge); });
  }
  return { nodes, outgoing, incoming, edges };
}

function graphAncestors(key, index) {
  const queue = [[key]], seen = new Set([key]);
  for (let cursor = 0; cursor < queue.length; cursor++) {
    const chain = queue[cursor], current = chain[0], node = index.nodes.get(current);
    const incoming = (index.incoming.get(current) || []).filter(edge => ["menu", "opens", "shows", "button"].includes(edge.kind));
    if (node && ["menu", "group"].includes(node.kind) && !incoming.some(edge => edge.kind === "menu")) return chain;
    for (const edge of incoming) if (!seen.has(edge.from)) { seen.add(edge.from); queue.push([edge.from, ...chain]); }
  }
  return [key];
}

function revealGraph(key) {
  const index = graphIndex(), chain = graphAncestors(key, index);
  if (!chain.includes(G.focus)) G.focus = chain[0];
  chain.forEach(item => G.expanded.add(item));
  const node = index.nodes.get(key);
  if (node && node.kind === "menu") {
    (index.outgoing.get(key) || []).filter(edge => edge.kind === "opens").forEach(edge => G.expanded.add(edge.to));
  }
  G.fit = true;
}

function graphLayout() {
  const index = graphIndex(), positions = new Map(), links = [];
  if (!G.focus || !index.nodes.has(G.focus)) {
    const roots = [...index.nodes.values()].filter(node => ["menu", "group"].includes(node.kind) && !(index.incoming.get(node.key) || []).some(edge => edge.kind === "menu"));
    const columns = roots.length > 6 ? 2 : 1, rows = Math.max(1, Math.ceil(roots.length / columns));
    positions.set("workspace", { key: "workspace", kind: "workspace", label: M.ws, x: 0, y: (rows - 1) * 136 / 2 });
    roots.forEach((node, i) => {
      positions.set(node.key, { ...node, x: 420 + Math.floor(i / rows) * 380, y: (i % rows) * 136 });
      links.push({ from: "workspace", to: node.key, kind: "menu", overview: true });
    });
  } else {
    const visited = new Set([G.focus]), children = new Map(), tree = new Set();
    function visit(key) {
      const next = [];
      if (G.expanded.has(key)) for (const edge of index.outgoing.get(key) || []) {
        if (!visited.has(edge.to)) { visited.add(edge.to); next.push(edge.to); tree.add(edge); visit(edge.to); }
      }
      children.set(key, next);
    }
    visit(G.focus);
    const heights = new Map();
    function measure(key) {
      const height = Math.max(132, (children.get(key) || []).reduce((sum, child) => sum + measure(child), 0));
      heights.set(key, height); return height;
    }
    function place(key, depth, top) {
      positions.set(key, { ...index.nodes.get(key), x: depth * 380, y: top + (heights.get(key) - graphNodeHeight) / 2 });
      for (const child of children.get(key) || []) { place(child, depth + 1, top); top += heights.get(child); }
    }
    measure(G.focus); place(G.focus, 0, 0);
    index.edges.forEach(edge => { if (positions.has(edge.from) && positions.has(edge.to)) links.push({ ...edge, secondary: !tree.has(edge) }); });
  }
  const values = [...positions.values()];
  const bounds = { x: -40, y: -80, width: Math.max(600, ...values.map(node => node.x + graphNodeWidth)) + 80,
    height: Math.max(300, ...values.map(node => node.y + graphNodeHeight)) + 135 };
  return { positions, links, bounds, index };
}

function svgLines(label, limit = 25) {
  const chars = [...String(label)], lines = [""], width = char => /[^\u0000-\u02ff]/.test(char) ? 1.7 : 1;
  let length = 0;
  chars.forEach(char => { if (length + width(char) > limit && lines.length < 2) { lines.push(""); length = 0; } lines[lines.length - 1] += char; length += width(char); });
  if (length > limit) { let n = 0; lines[1] = [...lines[1]].filter(char => (n += width(char)) < limit - 1).join("") + "…"; }
  return lines;
}

function graphSvg(layout) {
  const routeEdges = new Set(G.route.map(edge => `${edge.from}|${edge.to}|${edge.kind}`));
  const paths = layout.links.map(edge => {
    const a = layout.positions.get(edge.from), b = layout.positions.get(edge.to);
    const x = a.x + graphNodeWidth, y = a.y + 48, tx = b.x, ty = b.y + 48;
    let path;
    if (edge.overview) path = b.x > 700 ? `M${x},${y}H340V-35H760V${ty}H${tx}` : `M${x},${y}H340V${ty}H${tx}`;
    else if (tx > x) path = `M${x},${y}C${x + (tx - x)/2},${y} ${x + (tx - x)/2},${ty} ${tx},${ty}`;
    else { const end = b.x + graphNodeWidth, rail = Math.max(x, end) + 65; path = `M${x},${y}C${rail},${y} ${rail},${ty} ${end},${ty}`; }
    const active = routeEdges.has(`${edge.from}|${edge.to}|${edge.kind}`);
    const label = !edge.overview && !edge.secondary ? ({ menu: "menu", opens: "opens", shows: "shows", button: edge.label || "button", row: "open row" }[edge.kind] || "") : "";
    return `<g><path class="diagram-edge${edge.secondary ? " secondary" : ""}${active ? " on-route" : ""}" d="${path}" marker-end="url(#${active ? "map-arrow-active" : "map-arrow"})"/>${label ? `<text class="diagram-edge-label" x="${(x + tx)/2}" y="${ty - 10}" text-anchor="middle">${esc(label.length > 26 ? label.slice(0,25) + "…" : label)}</text>` : ""}</g>`;
  }).join("");
  const nodes = [...layout.positions.values()].map(node => {
    const outgoing = layout.index.outgoing.get(node.key) || [];
    const expandable = outgoing.length > 0 && node.kind !== "workspace";
    const subtitle = node.kind === "workspace" ? `${M.data.meta.menus} menus · ${M.data.meta.actions} actions · ${M.data.meta.views} views`
      : node.kind === "view" ? `${node.fields} fields · ${node.buttons} buttons` : node.model || node.xmlid || `${outgoing.length} connections`;
    const lines = svgLines(node.label);
    return `<g class="diagram-node ${node.kind}${node.key === M.key ? " selected" : ""}" transform="translate(${node.x},${node.y})">
      <g class="map-item" ${node.kind === "workspace" ? 'data-map-home="true"' : node.kind === "group" ? `data-map-focus="${esc(node.key)}"` : `data-map-screen="${esc(node.key)}"`} role="button" tabindex="0" aria-label="${esc(node.trail || node.label)}" aria-current="${node.key === M.key}">
        <rect class="node-body" width="280" height="96" rx="11"/><rect class="node-strip" x="0" y="19" width="3" height="58" rx="1.5"/>
        <text class="node-type" x="20" y="22">${node.kind === "workspace" ? "WORKSPACE" : esc(node.kind.toUpperCase()) + (node.kind === "view" ? " / " + esc(node.type) : "")}</text>
        <text class="node-title" x="20" y="${lines.length === 1 ? 48 : 44}">${lines.map((line, i) => `<tspan x="20" dy="${i ? 18 : 0}">${esc(line)}</tspan>`).join("")}</text>
        <text class="node-sub" x="20" y="81">${esc(subtitle.length > 38 ? subtitle.slice(0,37) + "…" : subtitle)}</text><title>${esc(node.trail || node.label)}${node.xmlid ? " · " + esc(node.xmlid) : ""}</title>
      </g>${expandable ? `<g class="node-expander" data-map-expand="${esc(node.key)}" role="button" tabindex="0" aria-label="${G.expanded.has(node.key) && G.focus ? "Thu gọn" : "Mở nhánh"} ${esc(node.label)}"><circle cx="280" cy="48" r="12"/><text x="280" y="54">${G.expanded.has(node.key) && G.focus ? "−" : "+"}</text></g>` : ""}</g>`;
  }).join("");
  return `<defs><pattern id="map-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--map-grid)"/></pattern><marker id="map-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="var(--map-edge)"/></marker><marker id="map-arrow-active" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="var(--map-blue)"/></marker></defs>
    <rect width="100%" height="100%" fill="url(#map-dots)"/><g id="mapGraphViewport">${paths}${nodes}</g>`;
}

function graphTransform() {
  const viewport = $("mapGraphViewport"), svg = $("mapDiagram");
  if (!viewport || !svg) return;
  viewport.setAttribute("transform", `translate(${G.x},${G.y}) scale(${G.zoom})`);
  if ($("mapZoomLevel")) $("mapZoomLevel").textContent = Math.round(G.zoom * 100) + "%";
  const mini = $("mapMiniViewport");
  if (mini) { mini.setAttribute("x", -G.x/G.zoom); mini.setAttribute("y", -G.y/G.zoom); mini.setAttribute("width", svg.clientWidth/G.zoom); mini.setAttribute("height", svg.clientHeight/G.zoom); }
}

function graphFit(initial = false) {
  const svg = $("mapDiagram");
  if (!svg || !G.layout || !svg.clientWidth) return;
  const b = G.layout.bounds;
  let width = svg.clientWidth, height = svg.clientHeight, top = 65;
  const inspector = $("mapScreen");
  if (G.inspector && inspector && window.innerWidth <= 767) { height = Math.max(180, inspector.offsetTop - 15); top = 135; }
  else if (G.inspector && inspector && window.innerWidth <= 1100) width = Math.max(210, width - inspector.offsetWidth - 30);
  G.zoom = Math.min(1.15, (width - 80)/b.width, (height - top - 45)/b.height);
  const minimum = initial ? (svg.clientWidth < 600 ? .58 : .65) : .15;
  const clamped = G.zoom < minimum;
  G.zoom = Math.max(minimum, G.zoom);
  G.x = (width - b.width * G.zoom)/2 - b.x*G.zoom;
  G.y = (height - b.height * G.zoom)/2 - b.y*G.zoom + top/2;
  const selected = G.layout.positions.get(M.key);
  if (clamped && selected) {
    G.x = width/2 - (selected.x + graphNodeWidth/2)*G.zoom;
    G.y = (top + height)/2 - (selected.y + graphNodeHeight/2)*G.zoom;
  }
  graphTransform();
}

function graphZoom(factor, x, y) {
  const svg = $("mapDiagram");
  if (!svg) return;
  x = x ?? svg.clientWidth/2; y = y ?? svg.clientHeight/2;
  const next = Math.max(.15, Math.min(2.5, G.zoom * factor)), ratio = next/G.zoom;
  G.x = x - (x - G.x)*ratio; G.y = y - (y - G.y)*ratio; G.zoom = next; graphTransform();
}

function resetGraph() { G.focus = ""; G.expanded.clear(); G.inspector = false; G.route = []; G.fit = true; M.key = ""; M.screen = null; renderMap(); }

    <form id="mapSearchForm" class="map-toolbar"><label>${workspaceSelect}</label><label class="map-query"><span class="map-search-box"><input type="search" id="mapQuery" value="${esc(M.q)}" placeholder="Tìm menu, action, view…  English / 日本語" aria-label="Tìm trong sitemap"><button class="btn primary" type="submit">Tìm</button></span></label>
    <label><select class="map-kind" id="mapKind" aria-label="Loại màn hình"><option value="">Tất cả</option>${["menu", "action", "view"].map(kind => `<option ${M.kind === kind ? "selected" : ""}>${kind}</option>`).join("")}</select></label><label><select id="mapLanguage" aria-label="Ngôn ngữ nội dung"><option value="en" ${M.lang !== "ja" ? "selected" : ""}>English</option><option value="ja" ${M.lang === "ja" ? "selected" : ""}>日本語</option></select></label><button class="btn" type="button" id="mapReload" ${M.loading ? "disabled" : ""} aria-label="Tải lại sitemap">↻</button></form>
    <section class="diagram-shell${G.inspector ? " has-inspector" : ""}">${body}</section><footer class="diagram-footer"><span>Kéo để di chuyển · cuộn để zoom · dấu + để mở nhánh · bấm node để xem chi tiết</span><span>${meta ? `${G.layout ? G.layout.positions.size : 0} node đang hiển thị · Odoo ${esc(meta.odoo_version)} · ${esc(meta.generated.slice(0,10))}${data.unresolved_count ? " · " + data.unresolved_count + " mục chưa đọc được" : ""}` : ""}</span></footer>`;
  const svg = $("mapDiagram");
  if (svg) {
    if (G.fit || (G.inspector && window.innerWidth <= 1100)) { graphFit(true); G.fit = false; } else graphTransform();
    let measured = `${svg.clientWidth}|${svg.clientHeight}`;
    G.resizeObserver = new ResizeObserver(() => {
      const size = `${svg.clientWidth}|${svg.clientHeight}`;
      if (size !== measured && svg.isConnected && S.tab === "site_map") { measured = size; graphFit(true); }
    });
    G.resizeObserver.observe(svg);
    svg.addEventListener("wheel", event => { event.preventDefault(); const bounds = svg.getBoundingClientRect(); graphZoom(event.deltaY < 0 ? 1.12 : 1/1.12, event.clientX - bounds.left, event.clientY - bounds.top); }, { passive: false });
    svg.addEventListener("pointerdown", event => {
      if (event.target.closest("[role=button]") || event.button !== 0) return;
      G.drag = { id: event.pointerId, x: event.clientX, y: event.clientY, ox: G.x, oy: G.y }; svg.setPointerCapture(event.pointerId); svg.classList.add("dragging");
    });
    svg.addEventListener("pointermove", event => { if (G.drag && G.drag.id === event.pointerId) { G.x = G.drag.ox + event.clientX - G.drag.x; G.y = G.drag.oy + event.clientY - G.drag.y; graphTransform(); } });
    const release = () => { G.drag = null; svg.classList.remove("dragging"); };
    svg.addEventListener("pointerup", release); svg.addEventListener("pointercancel", release);
  }
}

async function loadMap() {
  const ws = mapWorkspace();
  if (ws !== M.ws) {
    Object.assign(M, { ws, lang: (S.workspaces.find(w => w.name === ws) || {}).language === "ja" ? "ja" : "en", q: "", kind: "", key: "", view: "", match: "", required: false, data: null, results: null, screen: null, detailError: "" });
    G.focus = ""; G.expanded.clear(); G.inspector = false; G.route = []; G.searchOpen = false; G.fit = true;
    M.detailRequest++;
  }
  const request = ++M.request;
  M.detailRequest++; M.detailLoading = false;
  if (!ws) return renderMap();
  M.loading = true; M.error = ""; renderMap();
  try {
    const data = await mapGet({ what: "show" });
    if (request !== M.request) return;
    let results = null;
    if (data.available && (M.q.trim() || M.kind)) { const found = await mapGet({ what: "find", q: M.q, kind: M.kind }); results = found.results || []; }
    if (request !== M.request) return;
    M.data = data; M.results = results; M.loading = false; renderMap();
    if (data.available && M.key && G.inspector) loadMapScreen();
  } catch (error) { if (request === M.request) { M.loading = false; M.error = error.message; renderMap(); } }
}

async function loadMapScreen() {
  const request = ++M.detailRequest;
  M.detailLoading = true; M.detailError = ""; renderMap();
  try {
    const screen = await mapGet({ what: "screen", screen: M.key, view: M.view, match: M.match, required: String(M.required) });
    if (request !== M.detailRequest) return;
    M.screen = screen; M.detailLoading = false; G.route = screen.route_edges || []; renderMap();
  } catch (error) { if (request === M.detailRequest) { M.detailLoading = false; M.detailError = error.message; renderMap(); } }
}

window.addEventListener("resize", () => { if (S.tab === "site_map" && $("mapDiagram")) graphFit(true); });


async function refreshList() {
  const [sessions, workspaces] = await Promise.all([get("/api/sessions"), get("/api/workspaces")]);
  const list = sessions.sessions;
  const sig = JSON.stringify([list, workspaces.workspaces]);
  if (sig === S.histSig) return;                       // nothing new: leave the list alone
  S.histSig = sig; S.sessions = list; S.workspaces = workspaces.workspaces || []; renderHistory();
}
/** True while the person is reading something they selected or typing: the page must not move under them. */
function busyReading() {
  const sel = window.getSelection();
  return (document.activeElement && document.activeElement.tagName === "TEXTAREA") || (sel && !sel.isCollapsed && sel.toString().trim() !== "");
}
async function refreshView() {
  if (!S.sel) return renderMain();
  const v = await get(`/api/session?ws=${encodeURIComponent(S.sel.ws)}&id=${encodeURIComponent(S.sel.id)}`);
  if (v.error) return;
  const sig = JSON.stringify(v);
  const changed = sig !== S.sig;
  S.view = v;
  if (!v.cases.some(c => c.id === S.caseId)) {
    const pick = v.cases.find(c => ["FAIL", "REPAIRING", "RUNNING", "EXPLORING"].includes(c.status)) || v.cases[0];
    S.caseId = pick ? pick.id : null; S.attempt = null;
  }
  if (changed && !busyReading()) { S.sig = sig; renderMain(); }        // redraw only when the data changed, and not while they are reading or typing
  const live = v.phase !== "DONE";
  $("dot").className = "dot" + (live ? " on" : "");
  $("liveText").textContent = live ? `Trực tiếp · cập nhật ${new Date().toLocaleTimeString("vi-VN")}` : `Đã xong · ${v.updated}`;
}
function select(ws, id) { S.sel = { ws, id }; S.view = null; S.sig = ""; S.caseId = null; S.attempt = null; history.replaceState(null, "", `#${encodeURIComponent(ws)}/${encodeURIComponent(id)}`); renderHistory(); refreshView(); if (S.tab === "site_map") loadMap(); }

document.addEventListener("click", async e => {
  const del = e.target.closest("[data-del-id]");
  if (del) {
    e.stopPropagation();
    if (!confirm("Xoá phiên test này? Ảnh bằng chứng và dữ liệu của phiên sẽ mất, không khôi phục được.")) return;
    const r = await post("/api/delete_session", { ws: del.dataset.delWs, id: del.dataset.delId });
    if (r.error) { alert(r.error); return; }
    if (S.sel && S.sel.ws === del.dataset.delWs && S.sel.id === del.dataset.delId) { S.sel = null; S.view = null; }
    await refreshList();
    return;
  }
  const ask = e.target.closest("[data-request-case]");
  if (ask && S.sel) {
    ask.disabled = true;                                           // a double click sends one request; the server keeps one per case anyway
    const r = await post("/api/dispatch-request", { ws: S.sel.ws, id: S.sel.id, case: ask.dataset.requestCase });
    S.requestError = r.error ? { case: ask.dataset.requestCase, text: r.error } : null;
    await refreshView(); renderDetail();
    return;
  }
  const rep = e.target.closest("[data-replay], [data-replay-all]");
  if (rep && S.sel) {
    rep.disabled = true;
    const record = rep.dataset.record === "1";
    const r = await post("/api/replay", { ws: S.sel.ws, id: S.sel.id, case: rep.dataset.replayAll ? "all" : rep.dataset.replay,
      ...(record ? RECORD_TIMING : S.replayTiming), fast: record ? false : S.fast, video: record ? "on" : S.videoMode });
    const msg = $("replayMsg");
    if (msg) msg.textContent = r.error || r.message || "Đã bắt đầu.";
    else if (r.error) alert(r.error);
    setTimeout(() => { rep.disabled = false; refreshList(); }, 4000);
    return;
  }
  if (e.target.closest("#railToggle")) { toggleRail(); return; }
  if (e.target.closest("#caseToggle")) { toggleCases(); return; }
  const jump = e.target.closest("[data-case-jump]");
  if (jump && S.sel) { S.caseId = jump.dataset.caseJump; S.attempt = null; renderMain(); return; }
  const open = e.target.closest("[data-script-open]");
  if (open) { e.preventDefault(); workspaceTab("progress"); select(R.ws, open.dataset.scriptOpen); S.caseId = open.dataset.scriptCase; S.attempt = null; return; }
  const t = e.target.closest("button, tr.case, [data-map-screen], [data-map-expand], [data-map-home], [data-map-focus]");
  if (!t) return;
  if (t.dataset.workspaceTab) return workspaceTab(t.dataset.workspaceTab);
  if (t.id === "scriptsReload") return loadScripts();
  if (t.dataset.regressEnv) {
    R.busy = true; renderScripts();
    const r = await post("/api/regress", { ws: R.ws, env: t.dataset.regressEnv, case: t.dataset.regressCase || "", video: t.dataset.record === "1" ? "on" : S.videoMode });
    R.msg = r.error || r.message || "Đã bắt đầu."; renderScripts();
    setTimeout(() => { R.busy = false; loadScripts(); }, 4000);
    return;
  }
  if (t.id === "mapReload") return loadMap();
  if (t.dataset.mapHome) return resetGraph();
  if (t.dataset.mapFocus) { G.focus = t.dataset.mapFocus; G.expanded.add(G.focus); G.inspector = false; G.fit = true; return renderMap(); }
  if (t.dataset.mapExpand) {
    e.preventDefault();
    const key = t.dataset.mapExpand;
    if (!G.focus) { G.focus = key; G.expanded.add(key); }
    else if (G.expanded.has(key)) G.expanded.delete(key); else G.expanded.add(key);
    G.fit = true; G.searchOpen = false; return renderMap();
  }
  if (t.id === "mapZoomIn") return graphZoom(1.25);
  if (t.id === "mapZoomOut") return graphZoom(1/1.25);
  if (t.id === "mapFit") return graphFit();
  if (t.id === "mapCollapse") { G.expanded.clear(); G.expanded.add(G.focus); G.fit = true; return renderMap(); }
  if (t.id === "mapCloseInspector") { G.inspector = false; G.fit = true; return renderMap(); }
  if (t.id === "mapCloseSearch") { G.searchOpen = false; return renderMap(); }
  if (t.dataset.mapScreen) {
    e.preventDefault();
    return selectGraphScreen(t.dataset.mapScreen);
  }
  if (t.dataset.mapMode) { M.mode = t.dataset.mapMode; return renderMap(); }
  if (t.classList.contains("hist")) return select(t.dataset.ws, t.dataset.id);
  if (t.matches("tr.case")) {
    S.caseId = t.dataset.id; S.attempt = null; renderMain();
    if (window.matchMedia("(max-width: 860px)").matches) $(".detail-column")?.scrollIntoView({ block:"start", behavior:"smooth" });
    return;
  }
  if (t.dataset.attempt) { S.attempt = +t.dataset.attempt; return renderDetail(); }
  if (t.dataset.g !== undefined) return openLightbox(+t.dataset.g);
  if (t.id === "lbClose") return $("lb").classList.remove("open");
  if (t.id === "lbPrev") { S.index = (S.index + S.gallery.length - 1) % S.gallery.length; return drawLightbox(); }
  if (t.id === "lbNext") { S.index = (S.index + 1) % S.gallery.length; return drawLightbox(); }
  if (t.id === "lbRaw") { S.raw = !S.raw; return drawLightbox(); }
  const where = { ws: S.sel && S.sel.ws, id: S.sel && S.sel.id };
  const call = {
    exportReport: () => post("/api/report", where),
    confirm: () => post("/api/confirm", where), stop: () => post("/api/stop", where), resume: () => post("/api/resume", where),
    sendAnswer: () => post("/api/answer", { ...where, text: ($("answer") || {}).value || "" }),
    sendReview: () => post("/api/review", { ...where, case: S.caseId, text: ($("reviewText") || {}).value || "" }),
    skipReview: () => post("/api/review", { ...where, case: S.caseId, text: ($("reviewText") || {}).value || "", skip: true }),
    addRef: () => post("/api/refs", { ...where, path: ($("refPath") || {}).value || "" }),
    sendHint: () => post("/api/hint", { ...where, case: S.caseId, text: ($("hint") || {}).value || "" }),
  }[t.id];
  if (call) {
    S.busy = true; S.error = ""; S.hintError = ""; renderMain();
    const r = await call();
    S.busy = false;
    if (t.id === "sendHint") { S.hintError = r.error || ""; if (!r.error) delete S.draft["hint-" + S.caseId]; } else S.error = r.error || "";
    if (t.id === "sendAnswer" && !r.error) delete S.draft.answer;
    if (["sendReview", "skipReview"].includes(t.id) && !r.error) delete S.draft["review-" + S.caseId];
    if (t.id === "addRef" && r.ok) delete S.draft.refPath;
    await refreshView();
    renderMain();
    if (t.id === "exportReport" && !r.error) window.location.assign(reportUrl(r.main));        // hand the workbook over as soon as it is built
  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.key) S.open[d.dataset.key] = d.open; }, true);

  if (e.target.tagName === "TEXTAREA") S.draft[e.target.dataset.draft || e.target.id] = e.target.value;
  if (e.target.id === "mapQuery") M.q = e.target.value;
  if (e.target.id === "mapMatch") M.match = e.target.value;
});
document.addEventListener("submit", e => {
  if (e.target.id === "mapSearchForm") { e.preventDefault(); G.searchOpen = true; return loadMap(); }
  if (e.target.id === "mapDetailForm") { e.preventDefault(); return loadMapScreen(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.fastMode !== undefined) {
    if (e.target.checked) { S.fastPrev = { ...S.replayTiming }; S.replayTiming.action_delay_ms = 0; S.replayTiming.step_delay_ms = 0; }
    else S.replayTiming = { ...S.fastPrev };
    S.fast = e.target.checked;
    saveFast();
    try { localStorage.setItem("oqaReplayTiming", JSON.stringify(S.replayTiming)); } catch (err) {}
    if (S.view) renderDetail();
    return;
  }
  if (e.target.dataset.replayDelay) {
    if (!e.target.checkValidity() || !Number.isInteger(Number(e.target.value)) || e.target.value === "") {
      e.target.value = S.replayTiming[e.target.dataset.replayDelay]; return;
    }
    S.replayTiming[e.target.dataset.replayDelay] = Number(e.target.value);
    try { localStorage.setItem("oqaReplayTiming", JSON.stringify(S.replayTiming)); } catch (err) {}
    return;
  }
  if (e.target.id === "mapWorkspace") { S.ws = e.target.value; renderHistory(); return workspaceTab("site_map"); }
  if (e.target.id === "scriptsWs") { R.ws = e.target.value; return loadScripts(); }
  if (e.target.id === "mapLanguage") { M.lang = e.target.value; return loadMap(); }
  if (e.target.id === "mapKind") { M.kind = e.target.value; G.searchOpen = !!(M.kind || M.q); return loadMap(); }
  if (e.target.id === "mapView") { M.view = e.target.value; return loadMapScreen(); }
  if (e.target.id === "mapRequired") { M.required = e.target.checked; return loadMapScreen(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("[data-map-screen], [data-map-expand], [data-map-home], [data-map-focus]") && ["Enter", " "].includes(e.key)) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles:true })); return; }
  if (e.target.id === "mapDiagram") {
    if (["+", "="].includes(e.key)) { e.preventDefault(); return graphZoom(1.25); }
    if (e.key === "-") { e.preventDefault(); return graphZoom(1/1.25); }
    if (e.key === "Home") { e.preventDefault(); return graphFit(); }
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) { e.preventDefault(); G.x += e.key === "ArrowLeft" ? 45 : e.key === "ArrowRight" ? -45 : 0; G.y += e.key === "ArrowUp" ? 45 : e.key === "ArrowDown" ? -45 : 0; return graphTransform(); }
  }
  if (e.key === "Escape" && S.tab === "site_map") { G.inspector = false; G.searchOpen = false; return renderMap(); }
  if (e.target.dataset.workspaceTab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const tab = e.key === "Home" ? "progress" : e.key === "End" ? "site_map" : e.target.dataset.workspaceTab === "progress" ? "site_map" : "progress";
    workspaceTab(tab); $(tab === "progress" ? "tab-progress" : "tab-site-map").focus(); return;
  }
  if (e.key === "Enter" && e.target.matches("tr.case")) return e.target.click();
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Escape") $("lb").classList.remove("open");
  else if (e.key === "ArrowLeft") $("lbPrev").click();
  else if (e.key === "ArrowRight") $("lbNext").click();
  else if (e.key.toLowerCase() === "r") $("lbRaw").click();
});
$("wsFilter").onchange = e => { S.ws = e.target.value; renderHistory(); if (S.tab === "site_map") workspaceTab("site_map"); };

(async function start() {
  await refreshList();
  const params = new URLSearchParams(location.search);
  if (S.workspaces.some(w => w.name === params.get("workspace"))) S.ws = params.get("workspace");
  const hash = location.hash.slice(1).split("/").map(decodeURIComponent);
  const first = (hash.length === 2 && S.sessions.find(s => s.workspace === hash[0] && s.session === hash[1])) || (BOOT.select && S.sessions.find(s => s.workspace === BOOT.select[0] && s.session === BOOT.select[1])) || S.sessions.find(s => !S.ws || s.workspace === S.ws);
  if (first) select(first.workspace, first.session); else { renderMain(); $("liveText").textContent = "chưa có phiên test"; }
  renderHistory();
  if (params.get("tab") === "site_map") workspaceTab("site_map");
  setInterval(() => { if (!$("lb").classList.contains("open")) refreshView(); }, 1500);
  setInterval(refreshList, 6000);
  setInterval(() => { if (S.tab === "scripts" && !R.busy) loadScripts(); }, 5000);
})();
</script>
